<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
<title>Project Info</title>
<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: "#6da84c", dark: "#5c9140", soft: "#eef5e8" },
          secondary: { DEFAULT: "#1985bf", soft: "#e7f3fa" },
        },
      },
    },
  };
</script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">

  <!-- This page is intentionally standalone (no admin sidebar/topbar) —
       it's what someone sees after scanning the QR, likely on their
       phone, not logged into the admin panel. -->

  <div class="max-w-2xl mx-auto p-4 sm:p-8">

    <div id="loading-state" class="py-24 text-center text-gray-400">
      <p class="text-sm">Loading project info...</p>
    </div>

    <div id="not-found-state" class="hidden py-24 text-center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-3 text-gray-300"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <h1 class="text-base font-semibold text-gray-700 mb-1">Project not found</h1>
      <p class="text-sm text-gray-400">This link may be invalid, or the project was created on a different device.</p>
    </div>

    <div id="project-content" class="hidden">

      <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm mb-4">
        <p class="text-xs font-medium text-secondary bg-secondary-soft inline-block px-2.5 py-1 rounded-full mb-3">Project Info</p>
        <h1 id="pi-project-name" class="text-xl font-bold text-gray-900 mb-1"></h1>
        <p id="pi-updated-at" class="text-xs text-gray-400"></p>
      </div>

      <div id="pi-image-wrap" class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm mb-4 hidden">
        <img id="pi-image" alt="Project image" class="w-full max-h-72 object-cover rounded-xl" />
      </div>

      <div id="pi-overview-wrap" class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm mb-4 hidden">
        <h2 class="text-sm font-semibold text-gray-700 mb-2">Product Overview</h2>
        <p id="pi-overview" class="text-sm text-gray-600 whitespace-pre-line leading-relaxed"></p>
      </div>

      <div id="pi-vendor-wrap" class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm mb-4 hidden">
        <h2 class="text-sm font-semibold text-gray-700 mb-2">Vendor Details</h2>
        <p id="pi-vendor" class="text-sm text-gray-600 whitespace-pre-line leading-relaxed"></p>
      </div>

      <div id="pi-notes-wrap" class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm mb-4 hidden">
        <h2 class="text-sm font-semibold text-gray-700 mb-2">Notes</h2>
        <p id="pi-notes" class="text-sm text-gray-600 whitespace-pre-line leading-relaxed"></p>
      </div>

      <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
        <h2 class="text-sm font-semibold text-gray-700 mb-3">Attached Files</h2>
        <div id="pi-files-list" class="flex flex-col gap-2">
          <!-- file rows injected here -->
        </div>
        <p id="pi-files-empty" class="text-sm text-gray-400 hidden">No files were attached to this project.</p>
      </div>

    </div>
  </div>

  <script src="assets/js/project-store.js"></script>
  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get("id");
      var record = id ? ProjectStore.get(id) : null;

      document.getElementById("loading-state").classList.add("hidden");

      if (!record) {
        document.getElementById("not-found-state").classList.remove("hidden");
        return;
      }

      document.getElementById("project-content").classList.remove("hidden");
      document.getElementById("pi-project-name").textContent = record.projectName || "Untitled Project";
      document.getElementById("pi-updated-at").textContent =
        "Last updated: " + new Date(record.updatedAt || record.createdAt).toLocaleString();

      setOptionalSection("pi-overview-wrap", "pi-overview", record.productOverview);
      setOptionalSection("pi-vendor-wrap", "pi-vendor", record.vendorDetails);
      setOptionalSection("pi-notes-wrap", "pi-notes", record.notes);

      if (record.image) {
        document.getElementById("pi-image-wrap").classList.remove("hidden");
        document.getElementById("pi-image").src = record.image.dataUrl;
      }

      var filesList = document.getElementById("pi-files-list");
      var files = [
        { label: "Completion Report", file: record.completionReport },
        { label: "General Report", file: record.generalReport },
      ].filter(function (f) { return f.file; });

      if (files.length === 0) {
        document.getElementById("pi-files-empty").classList.remove("hidden");
      } else {
        files.forEach(function (f) {
          filesList.appendChild(buildFileRow(f.label, f.file));
        });
      }

      function setOptionalSection(wrapId, textId, value) {
        if (!value) return;
        document.getElementById(wrapId).classList.remove("hidden");
        document.getElementById(textId).textContent = value;
      }

      function buildFileRow(label, fileRecord) {
        var row = document.createElement("a");
        row.href = fileRecord.dataUrl;
        row.download = fileRecord.name;
        row.className = "flex items-center gap-3 rounded-xl border border-gray-200 px-3.5 py-3 hover:bg-gray-50 transition-colors";
        row.innerHTML =
          '<span class="flex items-center justify-center w-9 h-9 rounded-lg bg-primary-soft text-primary-dark shrink-0">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
          '</span>' +
          '<span class="min-w-0 flex-1">' +
          '<span class="block text-sm font-medium text-gray-800 truncate">' + label + '</span>' +
          '<span class="block text-xs text-gray-400 truncate">' + fileRecord.name + '</span>' +
          '</span>' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 shrink-0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>';
        return row;
      }
    })();
  </script>
</body>
</html>

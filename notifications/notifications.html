  /* Toggle switch */
  .toggle-switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
  }
  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #cbd5e1;
    transition: 0.3s;
    border-radius: 20px;
  }
  .toggle-slider:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.3s;
    border-radius: 50%;
  }
  .toggle-switch input:checked + .toggle-slider {
    background-color: #6da84c;
  }
  .toggle-switch input:checked + .toggle-slider:before {
    transform: translateX(16px);
  }

      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

          ${fld('Template Name *', '<input type="text" class="form-input" id="t_name" value="' + t.name + '">')}
          ${fld('Category', '<select class="form-input" id="t_cat"><option ' + (t.category === 'Sales' ? 'selected' : '') + '>Sales</option><option ' + (t.category === 'Purchase' ? 'selected' : '') + '>Purchase</option><option ' + (t.category === 'Inventory' ? 'selected' : '') + '>Inventory</option><option ' + (t.category === 'Projects' ? 'selected' : '') + '>Projects</option><option ' + (t.category === 'System' ? 'selected' : '') + '>System</option></select>')}
          ${fld('Subject', '<input type="text" class="form-input" id="t_subject" value="' + t.subject.replace(/"/g, '&quot;') + '">')}
          ${fld('Body', '<textarea rows="8" class="form-input" id="t_body">' + t.body + '</textarea>', 'Use placeholders like {customer_name}, {amount}, {company_name}')}
        </div>
        ${modalFooter('Save Template', 'onclick="saveTemplate(\'' + id + '\')"')}
      `;
      openModal(modalContent, { width: 'max-w-2xl' });
    }

    function saveTemplate(id) {
      var t = emailTemplates.find(function(x) { return x.id === id; });
      if (!t) return;
      t.name = document.getElementById('t_name').value.trim();
      t.category = document.getElementById('t_cat').value;
      t.subject = document.getElementById('t_subject').value;
      t.body = document.getElementById('t_body').value;
      closeModal();
      renderTemplates();
      showToast('Template updated', 'success');
    }

    function previewTemplate(id) {
      var t = emailTemplates.find(function(x) { return x.id === id; });
      if (!t) return;

      var sampleSubject = t.subject
        .replace(/{customer_name}/g, 'XYZ Retail Store')
        .replace(/{vendor_name}/g, 'Global Imports Inc.')
        .replace(/{invoice_number}/g, 'INV/25-26/001')
        .replace(/{po_number}/g, 'PO/25-26/001')
        .replace(/{bill_number}/g, 'PUR/25-26/001')
        .replace(/{amount}/g, '₹1,67,029')
        .replace(/{due_date}/g, '30-Jan-2026')
        .replace(/{payment_date}/g, '25-Jan-2026')
        .replace(/{payment_mode}/g, 'Bank Transfer')
        .replace(/{company_name}/g, 'Kunash Media Pvt. Ltd.')
        .replace(/{user_name}/g, 'Rajesh Sharma')
        .replace(/{item_name}/g, 'Chemical Dosing Pump')
        .replace(/{current_stock}/g, '3')
        .replace(/{reorder_level}/g, '5')
        .replace(/{unit}/g, 'Pcs');

      var sampleBody = t.body
        .replace(/{customer_name}/g, 'XYZ Retail Store')
        .replace(/{vendor_name}/g, 'Global Imports Inc.')
        .replace(/{invoice_number}/g, 'INV/25-26/001')
        .replace(/{po_number}/g, 'PO/25-26/001')
        .replace(/{bill_number}/g, 'PUR/25-26/001')
        .replace(/{amount}/g, '₹1,67,029')
        .replace(/{due_date}/g, '30-Jan-2026')
        .replace(/{payment_date}/g, '25-Jan-2026')
        .replace(/{payment_mode}/g, 'Bank Transfer')
        .replace(/{company_name}/g, 'Kunash Media Pvt. Ltd.')
        .replace(/{user_name}/g, 'Rajesh Sharma')
        .replace(/{item_name}/g, 'Chemical Dosing Pump')
        .replace(/{current_stock}/g, '3')
        .replace(/{reorder_level}/g, '5')
        .replace(/{unit}/g, 'Pcs');

      var modalContent = `
        ${modalHeader('Email Preview', 'Sample data shown')}
        <div class="px-5 py-4">
          <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
            <div class="text-[11px] text-gray-500 mb-2">
              <b>From:</b> no-reply@kunashmedia.com<br>
              <b>To:</b> customer@example.com<br>
              <b>Subject:</b> ${sampleSubject}
            </div>
            <div class="bg-white border border-gray-200 rounded-lg p-4 text-[12px] text-gray-700 whitespace-pre-wrap font-mono">${sampleBody}</div>
          </div>
        </div>
        ${modalFooter('Close', 'onclick="closeModal()"')}
      `;
      openModal(modalContent, { width: 'max-w-2xl' });
    }

    function openAddTemplate() {
      var modalContent = `
        ${modalHeader('Add Email Template', 'Create a new email template')}
        <div class="px-5 py-4 modal-scroll">
          ${fld('Template Name *', '<input type="text" class="form-input" id="t_name" placeholder="e.g. Welcome Email">')}
          ${fld('Category', '<select class="form-input" id="t_cat"><option>Sales</option><option>Purchase</option><option>Inventory</option><option>Projects</option><option>System</option></select>')}
          ${fld('Subject', '<input type="text" class="form-input" id="t_subject" placeholder="Subject line">')}
          ${fld('Body', '<textarea rows="8" class="form-input" id="t_body" placeholder="Email body with placeholders"></textarea>')}
        </div>
        ${modalFooter('Create Template', 'onclick="createTemplate()"')}
      `;
      openModal(modalContent, { width: 'max-w-2xl' });
    }

    function createTemplate() {
      var name = document.getElementById('t_name').value.trim();
      if (!name) { showToast('Template name is required', 'error'); return; }
      emailTemplates.push({
        id: 'TPL-' + String(emailTemplates.length + 1).padStart(3, '0'),
        name: name,
        subject: document.getElementById('t_subject').value,
        body: document.getElementById('t_body').value,
        category: document.getElementById('t_cat').value
      });
      closeModal();
      renderTemplates();
      showToast('Template created', 'success');
    }

    function deleteTemplate(id) {
      if (confirm('Delete this template?')) {
        emailTemplates = emailTemplates.filter(function(x) { return x.id !== id; });
        renderTemplates();
        showToast('Template deleted', 'warning');
      }
    }

    // =============================================================
    // RENDER PREFERENCES
    // =============================================================

    function renderSettings() {
      var p = preferences;

      document.getElementById('settingsPanel').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h4 class="text-sm font-bold text-gray-800 mb-3">Notification Channels</h4>
            <div class="space-y-3">
              ${channelRow('Email Notifications', 'emailNotifications', p.emailNotifications)}
              ${channelRow('In-App Notifications', 'inAppNotifications', p.inAppNotifications)}
              ${channelRow('Sound Alerts', 'soundAlerts', p.soundAlerts)}
            </div>
          </div>

          <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h4 class="text-sm font-bold text-gray-800 mb-3">Reports & Digests</h4>
            <div class="space-y-3">
              ${channelRow('Daily Digest (8:00 AM)', 'dailyDigest', p.dailyDigest)}
              ${channelRow('Weekly Summary Report', 'weeklyReport', p.weeklyReport)}
            </div>
          </div>

          <div class="bg-white border border-gray-200 rounded-xl p-4 md:col-span-2">
            <h4 class="text-sm font-bold text-gray-800 mb-3">Notify Admin On</h4>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
              ${channelRow('New Sale', 'notifyAdminOn_newSale', p.notifyAdminOn.newSale)}
              ${channelRow('New Purchase', 'notifyAdminOn_newPurchase', p.notifyAdminOn.newPurchase)}
              ${channelRow('Payment Received', 'notifyAdminOn_paymentReceived', p.notifyAdminOn.paymentReceived)}
              ${channelRow('Low Stock', 'notifyAdminOn_lowStock', p.notifyAdminOn.lowStock)}
              ${channelRow('Approval Pending', 'notifyAdminOn_approvalPending', p.notifyAdminOn.approvalPending)}
              ${channelRow('Overdue Invoice', 'notifyAdminOn_overdueInvoice', p.notifyAdminOn.overdueInvoice)}
            </div>
          </div>

          <div class="bg-white border border-gray-200 rounded-xl p-4 md:col-span-2">
            <h4 class="text-sm font-bold text-gray-800 mb-3">Quiet Hours</h4>
            <div class="flex flex-wrap items-center gap-4">
              <label class="flex items-center gap-2 text-[12px]">
                <input type="checkbox" id="quiet_enabled" ${p.quietHours.enabled ? 'checked' : ''} class="accent-primary">
                <span>Enable Quiet Hours</span>
              </label>
              <div class="flex items-center gap-2">
                <span class="text-[11px] text-gray-600">From</span>
                <input type="time" class="form-input" id="quiet_from" value="${p.quietHours.from}" style="width:100px;">
                <span class="text-[11px] text-gray-600">To</span>
                <input type="time" class="form-input" id="quiet_to" value="${p.quietHours.to}" style="width:100px;">
              </div>
            </div>
            <div class="text-[10.5px] text-gray-400 mt-2">No notifications will be sent during these hours (except critical alerts).</div>
          </div>
        </div>

        <div class="mt-4 flex gap-2">
          <button onclick="savePreferences()" class="px-4 py-1.5 rounded-lg bg-primary hover:bg-primary-dark text-white text-xs font-semibold transition shadow-sm">Save Preferences</button>
        </div>
      `;
    }

    function channelRow(label, key, checked) {
      return `
        <div class="flex items-center justify-between py-1.5">
          <span class="text-[12px] text-gray-700">${label}</span>
          <label class="toggle-switch">
            <input type="checkbox" data-pref="${key}" ${checked ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
        </div>`;
    }

    function savePreferences() {
      document.querySelectorAll('[data-pref]').forEach(function(el) {
        var key = el.dataset.pref;
        if (key.indexOf('notifyAdminOn_') === 0) {
          preferences.notifyAdminOn[key.replace('notifyAdminOn_', '')] = el.checked;
        } else {
          preferences[key] = el.checked;
        }
      });

      var qe = document.getElementById('quiet_enabled');
      var qf = document.getElementById('quiet_from');
      var qt = document.getElementById('quiet_to');
      if (qe) preferences.quietHours.enabled = qe.checked;
      if (qf) preferences.quietHours.from = qf.value;
      if (qt) preferences.quietHours.to = qt.value;

      showToast('Preferences saved successfully', 'success');
    }

    // =============================================================
    // INIT
    // =============================================================

    renderInbox();
    renderRules();
    renderTemplates();
    renderSettings();

    console.log('🔔 Notifications & Automation Module Loaded Successfully');
    console.log('📬 Notifications:', notifications.length);
    console.log('⚙️ Automation Rules:', automationRules.length);
    console.log('📧 Email Templates:', emailTemplates.length);

  </script>

</body>
</html>

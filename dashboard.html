<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dashboard</title>

<!--
  ANTI-FLICKER SCRIPT — must be the first thing in <head>, before any
  stylesheet. It reads the saved collapse state synchronously and sets
  it on <html> so the sidebar is the correct width on the very first
  paint. Copy this exact block, unchanged, to the top of every admin page.
-->
<script>
  (function () {
    try {
      var collapsed = localStorage.getItem("sidebarCollapsed") === "true";
      document.documentElement.classList.add(collapsed ? "sidebar-collapsed" : "sidebar-expanded");
    } catch (e) {
      document.documentElement.classList.add("sidebar-expanded");
    }
  })();
</script>

<!-- Tailwind (utility classes for page content) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: "#6da84c", dark: "#5c9140", soft: "#eef5e8" },
          secondary: { DEFAULT: "#1985bf", soft: "#e7f3fa" },
        },
      },
    },
  };
</script>
<style>
   .stat-card-border{
        border: 1px solid #65b03ab5;
    }
</style>

<!-- Shell styling (sidebar / topbar / overlays) — source of truth, loads after Tailwind -->
<link rel="stylesheet" href="assets/css/nav-sidebar.css" />
</head>

<body class="bg-gray-50 text-gray-800 antialiased">

  <div class="flex min-h-screen">
    <!-- Sidebar gets injected here by nav-sidebar.js -->
    <div id="sidebar-root"></div>

    <div class="app-main flex-1 flex flex-col min-w-0">
      <!-- Top bar gets injected here -->
      <div id="topbar-root"></div>

      <!-- ============= PAGE CONTENT STARTS HERE ============= -->
      <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-6xl mx-auto">

          <!-- ---- Stat cards ---- -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white stat-card-border rounded-2xl p-5 shadow-sm">
              <p class="text-xs font-medium text-gray-500 mb-1">Total Projects</p>
              <p id="stat-total" class="text-2xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white stat-card-border rounded-2xl p-5 shadow-sm">
              <p class="text-xs font-medium text-gray-500 mb-1">This Month</p>
              <p id="stat-month" class="text-2xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white stat-card-border rounded-2xl p-5 shadow-sm">
              <p class="text-xs font-medium text-gray-500 mb-1">Last 6 Months</p>
              <p id="stat-6mo" class="text-2xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white stat-card-border rounded-2xl p-5 shadow-sm">
              <p class="text-xs font-medium text-gray-500 mb-1">Last 1 Year</p>
              <p id="stat-1yr" class="text-2xl font-bold text-gray-800">0</p>
            </div>
          </div>

          <!-- ---- Filters ---- -->
          <div class="bg-white stat-card-border rounded-2xl p-4 shadow-sm mb-4 flex flex-col sm:flex-row gap-3 sm:items-center">
            <div class="relative flex-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input
                id="filter-search"
                type="text"
                placeholder="Search by project name..."
                class="w-full rounded-xl border border-gray-200 pl-9 pr-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary"
              />
            </div>
            <input
              id="filter-month"
              type="month"
              class="rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary"
            />
            <button
              id="filter-reset-btn"
              type="button"
              class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-200 hover:bg-gray-50 text-gray-600 text-sm font-medium px-4 py-2.5 transition-colors"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
              Reset
            </button>
          </div>

          <!-- ---- Table ---- -->
          <div class="bg-white stat-card-border rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="border-b border-gray-200 bg-gray-50/60">
                    <th class="text-left font-semibold text-gray-600 px-4 py-3">Project Name</th>
                    <th class="text-left font-semibold text-gray-600 px-4 py-3">Created Date</th>
                    <th class="text-left font-semibold text-gray-600 px-4 py-3">Project Overview</th>
                    <th class="text-right font-semibold text-gray-600 px-4 py-3">Action</th>
                  </tr>
                </thead>
                <tbody id="projects-tbody"></tbody>
              </table>
            </div>
            <div id="table-empty-state" class="hidden text-center py-14 text-gray-400">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-2 opacity-60"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
              <p class="text-sm">No projects found.</p>
            </div>
          </div>

        </div>
      </main>
      <!-- ============= PAGE CONTENT ENDS HERE ============= -->
    </div>
  </div>

  <!-- ================= VIEW MODAL (readonly) ================= -->
  <div id="view-overlay" class="confirm-overlay" aria-hidden="true">
    <div class="confirm-overlay-backdrop" data-close-view></div>
    <div class="confirm-dialog" style="max-width: 560px; text-align: left; max-height: 85vh; overflow-y: auto;">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-gray-800">Project Details</h2>
        <button type="button" data-close-view class="icon-btn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="flex flex-col gap-4 text-left">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Project Name</label>
          <p id="view-project-name" class="text-sm text-gray-800 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5"></p>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Product Overview Description</label>
          <p id="view-overview" class="text-sm text-gray-800 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 whitespace-pre-line"></p>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Vendor Details Description</label>
          <p id="view-vendor" class="text-sm text-gray-800 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 whitespace-pre-line"></p>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Notes</label>
          <p id="view-notes" class="text-sm text-gray-800 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 whitespace-pre-line"></p>
        </div>

        <div id="view-image-wrap" class="hidden">
          <label class="block text-xs font-medium text-gray-500 mb-1">Image</label>
          <img id="view-image" alt="Project image" class="w-full max-h-56 object-cover rounded-xl border border-gray-200" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">Files</label>
          <div id="view-files-list" class="flex flex-col gap-2"></div>
          <p id="view-files-empty" class="text-xs text-gray-400 hidden">No files attached.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= EDIT MODAL ================= -->
  <div id="edit-overlay" class="confirm-overlay" aria-hidden="true">
    <div class="confirm-overlay-backdrop" data-close-edit></div>
    <div class="confirm-dialog" style="max-width: 640px; text-align: left; max-height: 85vh; overflow-y: auto;">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-gray-800">Edit Project</h2>
        <button type="button" data-close-edit class="icon-btn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="edit-form" class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-4">

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Project Name</label>
          <input id="edit-field-project-name" type="text" required
            class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary" />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Product Overview Description</label>
          <textarea id="edit-field-product-overview" rows="3"
            class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary resize-y"></textarea>
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Vendor Details Description</label>
          <textarea id="edit-field-vendor-details" rows="3"
            class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary resize-y"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Image</label>
          <input id="edit-field-image" type="file" accept="image/*"
            class="w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-primary-soft file:text-primary-dark file:text-sm file:font-medium hover:file:bg-primary/20 rounded-xl border border-gray-200 px-2 py-1.5" />
          <p id="edit-field-image-existing" class="text-xs text-gray-400 mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Completion Report (PDF)</label>
          <input id="edit-field-completion-report" type="file" accept="application/pdf"
            class="w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-primary-soft file:text-primary-dark file:text-sm file:font-medium hover:file:bg-primary/20 rounded-xl border border-gray-200 px-2 py-1.5" />
          <p id="edit-field-completion-report-existing" class="text-xs text-gray-400 mt-1 hidden"></p>
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">General Report (PDF)</label>
          <input id="edit-field-general-report" type="file" accept="application/pdf"
            class="w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-primary-soft file:text-primary-dark file:text-sm file:font-medium hover:file:bg-primary/20 rounded-xl border border-gray-200 px-2 py-1.5" />
          <p id="edit-field-general-report-existing" class="text-xs text-gray-400 mt-1 hidden"></p>
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Notes</label>
          <textarea id="edit-field-notes" rows="3"
            class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary resize-y"></textarea>
        </div>

        <div class="sm:col-span-2 flex items-center justify-between pt-2">
          <span id="edit-form-status" class="text-xs text-gray-400"></span>
          <div class="flex items-center gap-2">
            <button type="button" data-close-edit class="rounded-xl border border-gray-200 hover:bg-gray-50 text-gray-600 text-sm font-medium px-4 py-2.5 transition-colors">Cancel</button>
            <button type="submit" class="inline-flex items-center gap-2 rounded-xl bg-primary hover:bg-primary-dark text-white text-sm font-semibold px-5 py-2.5 transition-colors">Save Changes</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= QR VIEW MODAL ================= -->
  <div id="qr-overlay" class="confirm-overlay" aria-hidden="true">
    <div class="confirm-overlay-backdrop" data-close-qr></div>
    <div class="confirm-dialog" style="max-width: 340px;">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-gray-800">Project QR</h2>
        <button type="button" data-close-qr class="icon-btn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="flex justify-center mb-4">
        <div class="p-4 rounded-2xl stat-card-border bg-gray-50">
          <img id="qr-modal-image" alt="Project QR code" class="w-48 h-48" />
        </div>
      </div>

     <p id="qr-modal-name" class="text-sm font-medium text-gray-700 text-center mb-4"></p>

      <label class="block text-xs font-medium text-gray-500 mb-1.5">Shareable link</label>
      <div class="flex items-center gap-2 mb-4">
        <input id="qr-modal-link-input" type="text" readonly class="flex-1 min-w-0 rounded-xl border border-gray-200 px-3 py-2 text-xs text-gray-600 bg-gray-50" />
        <button id="qr-modal-copy-btn" type="button" class="icon-btn shrink-0" aria-label="Copy link" title="Copy link">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button id="qr-modal-share-btn" type="button" class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-200 hover:bg-gray-50 text-gray-700 text-sm font-medium px-3 py-2.5 transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line></svg>
          Share
        </button>
        <button
          type="button"
          id="qr-modal-download-btn"
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-primary hover:bg-primary-dark text-white text-sm font-semibold px-3 py-2.5 transition-colors"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download
        </button>
      </div>
    </div>
  </div>

  <!-- ================= DELETE CONFIRM OVERLAY ================= -->
  <div id="delete-overlay" class="confirm-overlay" aria-hidden="true">
    <div class="confirm-overlay-backdrop" data-close-delete></div>
    <div class="confirm-dialog" role="alertdialog" aria-modal="true">
      <div class="confirm-dialog-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </div>
      <h2 class="confirm-dialog-title">Delete this project?</h2>
      <p class="confirm-dialog-text">This will permanently remove the project and its QR link stops working.</p>
      <div class="confirm-dialog-actions">
        <button type="button" id="delete-cancel-btn" class="confirm-btn confirm-btn-secondary">No, keep it</button>
        <button type="button" id="delete-confirm-btn" class="confirm-btn confirm-btn-danger">Yes, delete</button>
      </div>
    </div>
  </div>

  <script src="assets/js/project-store.js"></script>
  <script src="assets/js/nav-sidebar.js"></script>
  <script>
    NavSidebar.init({
      basePath: "",
      activePage: "dashboard",
      pageTitle: "Dashboard",
      user: {
        name: "Aarav Shah",
        role: "Administrator",
        avatarUrl: "", // leave empty to show initials fallback
      },
    });

    // Once auth.js exists, override the default redirect, e.g.:
    // NavSidebar.onLogoutConfirmed = function () { Auth.logout(); };

    (function () {
      var allProjects = [];
      var pendingDeleteId = null;

      var searchInput = document.getElementById("filter-search");
      var monthInput = document.getElementById("filter-month");
      var resetBtn = document.getElementById("filter-reset-btn");
      var tbody = document.getElementById("projects-tbody");
      var emptyState = document.getElementById("table-empty-state");

      function loadAndRender() {
        allProjects = ProjectStore.list();
        renderStats(allProjects);
        renderTable(applyFilters(allProjects));
      }

      function renderStats(projects) {
        var now = Date.now();
        var day = 24 * 60 * 60 * 1000;
        var thisMonthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
        var sixMonthsAgo = now - 182 * day;
        var oneYearAgo = now - 365 * day;

        document.getElementById("stat-total").textContent = projects.length;
        document.getElementById("stat-month").textContent = projects.filter(function (p) { return p.createdAt >= thisMonthStart; }).length;
        document.getElementById("stat-6mo").textContent = projects.filter(function (p) { return p.createdAt >= sixMonthsAgo; }).length;
        document.getElementById("stat-1yr").textContent = projects.filter(function (p) { return p.createdAt >= oneYearAgo; }).length;
      }

      function applyFilters(projects) {
        var query = searchInput.value.trim().toLowerCase();
        var month = monthInput.value; // "YYYY-MM" or ""

        return projects.filter(function (p) {
          var matchesSearch = !query || (p.projectName || "").toLowerCase().indexOf(query) !== -1;
          var matchesMonth = true;
          if (month) {
            var d = new Date(p.createdAt);
            var pMonth = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
            matchesMonth = pMonth === month;
          }
          return matchesSearch && matchesMonth;
        });
      }

      function renderTable(projects) {
        tbody.innerHTML = "";
        if (projects.length === 0) {
          emptyState.classList.remove("hidden");
          return;
        }
        emptyState.classList.add("hidden");

        projects.forEach(function (p) {
          var tr = document.createElement("tr");
          tr.className = "border-b border-gray-100 last:border-0 hover:bg-gray-50/60";
          tr.innerHTML =
            '<td class="px-4 py-3 font-medium text-gray-800">' + escapeHtml(p.projectName || "Untitled") + "</td>" +
            '<td class="px-4 py-3 text-gray-500 whitespace-nowrap">' + new Date(p.createdAt).toLocaleDateString() + "</td>" +
            '<td class="px-4 py-3 text-gray-500 max-w-xs truncate">' + escapeHtml(p.productOverview || "—") + "</td>" +
            '<td class="px-4 py-3">' +
              '<div class="flex items-center justify-end gap-1.5">' +
                actionBtn("view", p.id, "View", '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>') +
                actionBtn("qr", p.id, "View QR", '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3z"></path><path d="M20 14h1v1h-1z"></path><path d="M14 20h1v1h-1z"></path><path d="M20 20h1v1h-1z"></path></svg>') +
                actionBtn("edit", p.id, "Edit", '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>') +
                actionBtn("delete", p.id, "Delete", '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>') +
              "</div>" +
            "</td>";
          tbody.appendChild(tr);
        });
      }

      function actionBtn(action, id, label, svg) {
        return '<button type="button" data-action="' + action + '" data-id="' + id + '" title="' + label + '" ' +
          'class="icon-btn" style="width:32px;height:32px;' + (action === "delete" ? "color:#dc2626;" : "") + '">' + svg + "</button>";
      }

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      tbody.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-action]");
        if (!btn) return;
        var id = btn.getAttribute("data-id");
        var action = btn.getAttribute("data-action");
        if (action === "view") openViewModal(id);
        if (action === "qr") openQrModal(id);
        if (action === "edit") openEditModal(id);
        if (action === "delete") openDeleteConfirm(id);
      });

      searchInput.addEventListener("input", function () { renderTable(applyFilters(allProjects)); });
      monthInput.addEventListener("change", function () { renderTable(applyFilters(allProjects)); });
      resetBtn.addEventListener("click", function () {
        searchInput.value = "";
        monthInput.value = "";
        renderTable(applyFilters(allProjects));
      });

      /* ---- View modal ---- */
      var viewOverlay = document.getElementById("view-overlay");
      function openViewModal(id) {
        var p = ProjectStore.get(id);
        if (!p) return;

        document.getElementById("view-project-name").textContent = p.projectName || "—";
        document.getElementById("view-overview").textContent = p.productOverview || "—";
        document.getElementById("view-vendor").textContent = p.vendorDetails || "—";
        document.getElementById("view-notes").textContent = p.notes || "—";

        var imageWrap = document.getElementById("view-image-wrap");
        if (p.image) {
          imageWrap.classList.remove("hidden");
          document.getElementById("view-image").src = p.image.dataUrl;
        } else {
          imageWrap.classList.add("hidden");
        }

        var filesList = document.getElementById("view-files-list");
        var filesEmpty = document.getElementById("view-files-empty");
        filesList.innerHTML = "";
        var files = [
          { label: "Completion Report", file: p.completionReport },
          { label: "General Report", file: p.generalReport },
        ].filter(function (f) { return f.file; });

        if (files.length === 0) {
          filesEmpty.classList.remove("hidden");
        } else {
          filesEmpty.classList.add("hidden");
          files.forEach(function (f) {
            var row = document.createElement("div");
            row.className = "flex items-center gap-3 rounded-xl border border-gray-200 px-3.5 py-2.5";
            row.innerHTML =
              '<span class="flex items-center justify-center w-8 h-8 rounded-lg bg-primary-soft text-primary-dark shrink-0">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
              "</span>" +
              '<span class="flex-1 min-w-0">' +
              '<span class="block text-sm font-medium text-gray-800 truncate">' + f.label + '</span>' +
              '<span class="block text-xs text-gray-400 truncate">' + escapeHtml(f.file.name) + "</span>" +
              "</span>" +
              '<a href="' + f.file.dataUrl + '" target="_blank" rel="noopener" ' +
              'class="text-xs font-medium text-secondary hover:underline shrink-0">View</a>' +
              '<a href="' + f.file.dataUrl + '" download="' + f.file.name + '" ' +
              'class="text-xs font-medium text-primary-dark hover:underline shrink-0">Download</a>';
            filesList.appendChild(row);
          });
        }

        viewOverlay.classList.add("open");
        viewOverlay.setAttribute("aria-hidden", "false");
      }
      document.querySelectorAll("[data-close-view]").forEach(function (el) {
        el.addEventListener("click", function () {
          viewOverlay.classList.remove("open");
          viewOverlay.setAttribute("aria-hidden", "true");
        });
      });

      /* ---- Edit modal ---- */
      var editOverlay = document.getElementById("edit-overlay");
      var editForm = document.getElementById("edit-form");
      var editStatus = document.getElementById("edit-form-status");
      var editingId = null;
      var editExistingFiles = { image: null, completionReport: null, generalReport: null };

      function openEditModal(id) {
        var p = ProjectStore.get(id);
        if (!p) return;

        editingId = id;
        editStatus.textContent = "";
        editForm.reset();

        document.getElementById("edit-field-project-name").value = p.projectName || "";
        document.getElementById("edit-field-product-overview").value = p.productOverview || "";
        document.getElementById("edit-field-vendor-details").value = p.vendorDetails || "";
        document.getElementById("edit-field-notes").value = p.notes || "";

        editExistingFiles.image = p.image || null;
        editExistingFiles.completionReport = p.completionReport || null;
        editExistingFiles.generalReport = p.generalReport || null;

        showEditExisting("edit-field-image-existing", p.image);
        showEditExisting("edit-field-completion-report-existing", p.completionReport);
        showEditExisting("edit-field-general-report-existing", p.generalReport);

        editOverlay.classList.add("open");
        editOverlay.setAttribute("aria-hidden", "false");
      }

      function showEditExisting(elId, fileRecord) {
        var el = document.getElementById(elId);
        el.classList.add("hidden");
        if (!fileRecord) return;
        el.textContent = "Current file: " + fileRecord.name + " (choose a new file to replace it)";
        el.classList.remove("hidden");
      }

      function closeEditModal() {
        editingId = null;
        editOverlay.classList.remove("open");
        editOverlay.setAttribute("aria-hidden", "true");
      }
      document.querySelectorAll("[data-close-edit]").forEach(function (el) {
        el.addEventListener("click", closeEditModal);
      });

      editForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!editingId) return;
        editStatus.textContent = "Saving...";

        var imageInput = document.getElementById("edit-field-image").files[0];
        var completionInput = document.getElementById("edit-field-completion-report").files[0];
        var generalInput = document.getElementById("edit-field-general-report").files[0];

        Promise.all([
          imageInput ? ProjectStore.fileToRecord(imageInput) : Promise.resolve(editExistingFiles.image),
          completionInput ? ProjectStore.fileToRecord(completionInput) : Promise.resolve(editExistingFiles.completionReport),
          generalInput ? ProjectStore.fileToRecord(generalInput) : Promise.resolve(editExistingFiles.generalReport),
        ]).then(function (files) {
          var data = {
            projectName: document.getElementById("edit-field-project-name").value.trim(),
            productOverview: document.getElementById("edit-field-product-overview").value.trim(),
            vendorDetails: document.getElementById("edit-field-vendor-details").value.trim(),
            notes: document.getElementById("edit-field-notes").value.trim(),
            image: files[0],
            completionReport: files[1],
            generalReport: files[2],
          };
          return ProjectStore.upsert(data, editingId);
        }).then(function () {
          closeEditModal();
          loadAndRender();
        }).catch(function (err) {
          console.error("[dashboard] edit save failed:", err);
          editStatus.textContent = "Something went wrong — check the console.";
        });
      });

      /* ---- QR view modal ---- */
      var qrOverlay = document.getElementById("qr-overlay");
      var qrModalImage = document.getElementById("qr-modal-image");
      var qrDownloadBtn = document.getElementById("qr-modal-download-btn");
      var currentQrProject = null;

      function openQrModal(id) {
        var p = ProjectStore.get(id);
        if (!p) return;

        currentQrProject = p;
        var infoUrl = new URL("project-info.html", window.location.href);
        infoUrl.searchParams.set("id", p.id);
        var infoUrlStr = infoUrl.toString();

        qrModalImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=" + encodeURIComponent(infoUrlStr);
        document.getElementById("qr-modal-name").textContent = p.projectName || "Untitled Project";
        document.getElementById("qr-modal-link-input").value = infoUrlStr;

        qrOverlay.classList.add("open");
        qrOverlay.setAttribute("aria-hidden", "false");
      }

      function closeQrModal() {
        currentQrProject = null;
        qrOverlay.classList.remove("open");
        qrOverlay.setAttribute("aria-hidden", "true");
      }
      document.querySelectorAll("[data-close-qr]").forEach(function (el) {
        el.addEventListener("click", closeQrModal);
      });

      document.getElementById("qr-modal-copy-btn").addEventListener("click", function () {
        var input = document.getElementById("qr-modal-link-input");
        input.select();
        navigator.clipboard && navigator.clipboard.writeText(input.value);
      });

      document.getElementById("qr-modal-share-btn").addEventListener("click", function () {
        var link = document.getElementById("qr-modal-link-input").value;
        if (navigator.share) {
          navigator.share({ title: "Project info", url: link }).catch(function () {});
        } else {
          navigator.clipboard && navigator.clipboard.writeText(link);
          alert("Link copied to clipboard (Web Share isn't supported in this browser).");
        }
      });

      qrDownloadBtn.addEventListener("click", function () {
        if (!currentQrProject) return;
        var fileName = (currentQrProject.projectName || "project").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + "-qr.png";

        // Fetch as a blob first — a plain <a download> on a cross-origin
        // image URL is unreliable across browsers, blob download always works.
        fetch(qrModalImage.src)
          .then(function (res) { return res.blob(); })
          .then(function (blob) {
            var blobUrl = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = blobUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(blobUrl);
          })
          .catch(function (err) {
            console.error("[dashboard] QR download failed:", err);
            alert("Couldn't download the QR right now — check your internet connection.");
          });
      });

      /* ---- Delete confirm ---- */
      var deleteOverlay = document.getElementById("delete-overlay");
      function openDeleteConfirm(id) {
        pendingDeleteId = id;
        deleteOverlay.classList.add("open");
        deleteOverlay.setAttribute("aria-hidden", "false");
      }
      function closeDeleteConfirm() {
        pendingDeleteId = null;
        deleteOverlay.classList.remove("open");
        deleteOverlay.setAttribute("aria-hidden", "true");
      }
      document.getElementById("delete-cancel-btn").addEventListener("click", closeDeleteConfirm);
      document.querySelectorAll("[data-close-delete]").forEach(function (el) {
        el.addEventListener("click", closeDeleteConfirm);
      });
      document.getElementById("delete-confirm-btn").addEventListener("click", function () {
        if (!pendingDeleteId) return;
        ProjectStore.remove(pendingDeleteId).then(function () {
          closeDeleteConfirm();
          loadAndRender();
        });
      });

      loadAndRender();
    })();
  </script>
</body>
</html>

<style>
  body {
    font-size: 12px;
    background: #f3f4f6;

  .form-input {

    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 5px 10px;

    outline: none;

    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.12);
    background: #ffffff;
  }
  .form-input:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
  }

  .form-label {
    font-size: 10px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 9.5px; color: #9ca3af; margin-top: 2px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }
  .badge-dot-purple { background: #8b5cf6; }

  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    padding: 10px 14px !important;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-card .stat-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
  }
  .stat-card .stat-value {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
    margin-top: 2px;
  }

  .table-row-hover:hover {
    background: #f8fafc;
  }

  .btn-icon-action {
    transition: all 0.15s ease;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }
  .btn-icon-action.primary:hover {
    background: #eef5e8;
    color: #6da84c;
  }

  .toast {
    animation: fadeIn 0.2s ease;
    font-size: 12px;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  .modal-scroll {
    max-height: 55vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }

  }

  .page-breadcrumb {

  /* PO Preview */
  .po-preview {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;

  .po-preview .po-company-name {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
  }
  .po-preview .po-company-details {
    font-size: 11px;
    color: #6b7280;

    margin-top: 4px;
  }
  .po-preview .po-title {
    font-size: 22px;
    font-weight: 700;
    color: #6da84c;
    letter-spacing: 0.04em;
  }
  .po-preview .po-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 12px;
  }
  .po-preview .po-meta .meta-label {
    font-weight: 600;
    color: #6b7280;

    text-transform: uppercase;

  }
  .po-preview .po-meta .meta-value {
    font-weight: 600;
    color: #1a1a2e;
  }
  .po-preview .po-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 12px;

  .po-preview .po-table th {
    background: #f8fafc;
    text-align: left;
    padding: 8px 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b7280;
    border-bottom: 2px solid #e5e7eb;
  }
  .po-preview .po-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #f1f5f9;
  }
  .po-preview .po-totals {
    margin-top: 12px;

    padding-top: 12px;
    text-align: right;
    font-size: 13px;
  }
  .po-preview .po-totals .total-row {
    display: flex;
    justify-content: flex-end;
    gap: 30px;
    padding: 3px 0;

  .po-preview .po-totals .total-row .label {
    color: #6b7280;
    font-weight: 500;
  }
  .po-preview .po-totals .total-row .value {
    font-weight: 600;
    min-width: 120px;
    text-align: right;
  }
  .po-preview .po-totals .grand-total {
    font-size: 16px;
    font-weight: 700;
    color: #6da84c;
    border-top: 2px solid #6da84c;
    padding-top: 8px;
    margin-top: 4px;
  }
  .po-preview .po-footer {
    margin-top: 20px;
    font-size: 11px;
    color: #6b7280;
    border-top: 1px solid #e5e7eb;
    padding-top: 12px;
    text-align: center;
  }
  .po-preview .po-terms {
    font-size: 11px;
    color: #6b7280;
    margin-top: 8px;

  /* Status colors */
  .status-draft { background: #f1f5f9; color: #475569; }
  .status-sent { background: #dbeafe; color: #1e40af; }
  .status-received { background: #dcfce7; color: #166534; }
  .status-partial { background: #fef3c7; color: #92400e; }
</style>

  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({

    // =============================================================
    // SVG ICONS
    // =============================================================
    function iconPlus() {

    }
    function iconEdit() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
    }
    function iconEye() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function iconX() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconFilter() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>`;
    }
    function iconSave() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`;
    }
    function iconInfo() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>`;
    }
    function iconDocument() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;

    function iconSend() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>`;
    }

    }
    function iconCurrency() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>`;
    }

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // MODAL
    // =============================================================
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="modal-title text-gray-900">${title}</h3>
            ${subtitle ? '<p class="modal-subtitle mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-2">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // =============================================================
    // DROPDOWN
    // =============================================================
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });

      var label = status.charAt(0).toUpperCase() + status.slice(1);
      if (status === 'partial') label = 'Partially Received';
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';

              <button onclick="addLineItem()" class="text-[10px] font-semibold text-primary hover:underline flex items-center gap-1">
                ${iconPlus()} Add Item
              </button>
            </div>
            <div class="border border-gray-200 rounded-lg overflow-hidden">
              <table class="w-full text-xs" id="lineItemsTable">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-2 py-1.5 text-left font-semibold text-gray-600">Item</th>
                    <th class="px-2 py-1.5 text-center font-semibold text-gray-600">Qty</th>
                    <th class="px-2 py-1.5 text-center font-semibold text-gray-600">Rate</th>
                    <th class="px-2 py-1.5 text-center font-semibold text-gray-600" style="width:36px;">Action</th>
                  </tr>
                </thead>
                <tbody id="lineItemsBody">
                  ${lineItemsHtml || '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products/services.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Footer Fields -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
            ${fld('Discount (%)', '<input type="number" class="form-input" id="f_discount" value="' + e.discount + '" placeholder="0" onchange="calcPOTotal()">')}
            ${fld('Tax Rate (%)', '<select class="form-input" id="f_tax" onchange="calcPOTotal()"><option ' + (e.tax == 0 ? 'selected' : '') + '>0</option><option ' + (e.tax == 5 ? 'selected' : '') + '>5</option><option ' + (e.tax == 12 ? 'selected' : '') + '>12</option><option ' + (e.tax == 18 ? 'selected' : '') + '>18</option><option ' + (e.tax == 28 ? 'selected' : '') + '>28</option></select>')}
            ${fld('Total Amount', '<input type="text" class="form-input" id="f_total" value="' + (e.total ? formatCurrency(e.total, e.currency) : '0') + '" disabled style="font-weight:bold;color:#6da84c;">')}
            ${fld('Status', '<select class="form-input" id="f_status"><option ' + (e.status === 'draft' ? 'selected' : '') + ' value="draft">Draft</option><option ' + (e.status === 'sent' ? 'selected' : '') + ' value="sent">Sent</option><option ' + (e.status === 'partial' ? 'selected' : '') + ' value="partial">Partially Received</option><option ' + (e.status === 'received' ? 'selected' : '') + ' value="received">Received</option></select>')}
          </div>

          ${fld('Notes', '<textarea rows="2" class="form-input" id="f_notes" placeholder="Additional notes">' + (e.notes || '') + '</textarea>')}
        </div>
        ${modalFooter(isEdit ? 'Update Purchase Order' : 'Save Purchase Order', 'onclick="savePO(\'' + (isEdit ? e.id : '') + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-4xl' });
      setTimeout(function() { calcPOTotal(); }, 100);
    }

    // =============================================================
    // LINE ITEM FUNCTIONS
    // =============================================================

    function addLineItem() {
      var tbody = document.getElementById('lineItemsBody');
      if (!tbody) return;
      var emptyRow = tbody.querySelector('tr td[colspan]');
      if (emptyRow) tbody.innerHTML = '';

      var idx = tbody.children.length;
      var row = document.createElement('tr');
      row.className = 'border-b border-gray-100 line-item-row';
      row.innerHTML = `
        <td class="px-2 py-1">
          <select class="form-input text-[10px] item-select" data-idx="${idx}">
            ${items.map(function(it) { return '<option value="' + it.id + '">' + it.name + '</option>'; }).join('')}
          </select>
        </td>
        <td class="px-2 py-1">
          <input type="number" class="form-input text-[10px] item-qty" value="1" data-idx="${idx}" placeholder="Qty" onchange="calcPOTotal()">
        </td>
        <td class="px-2 py-1">
          <input type="number" class="form-input text-[10px] item-rate" value="0" data-idx="${idx}" placeholder="Rate" onchange="calcPOTotal()">
        </td>
        <td class="px-2 py-1 text-center">
          <button onclick="removeLineItem(this)" class="text-red-500 hover:text-red-700 transition">${iconX()}</button>
        </td>
      `;
      tbody.appendChild(row);

      var select = row.querySelector('.item-select');
      select.addEventListener('change', function() {
        var selectedItem = items.find(function(it) { return it.id === this.value; });
        var rateInput = this.closest('tr').querySelector('.item-rate');
        if (selectedItem && rateInput) {
          rateInput.value = selectedItem.price;
          calcPOTotal();
        }
      });
      select.dispatchEvent(new Event('change'));
    }

    function removeLineItem(btn) {
      var row = btn.closest('tr');
      if (row) row.remove();
      var tbody = document.getElementById('lineItemsBody');
      if (tbody && tbody.children.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products/services.</td></tr>';
      }
      calcPOTotal();
    }

    function updateVendorDetails() {
      var vendorId = document.getElementById('f_vendor').value;
      var vendor = vendors.find(function(v) { return v.id === vendorId; });
      // Currency can be auto-set based on vendor (for foreign vendors)
    }

    function updateCurrency() {
      var currency = document.getElementById('f_currency').value;
      var rates = { INR: 1, USD: 83.5, EUR: 90.2, GBP: 105.8, AED: 22.7 };
      document.getElementById('f_exchangeRate').value = rates[currency] || 1;
      calcPOTotal();
    }

    function calcPOTotal() {
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      var subtotal = 0;
      rows.forEach(function(row) {
        var qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        var rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        subtotal += qty * rate;
      });

      var discount = parseFloat(document.getElementById('f_discount').value) || 0;
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;
      var exchangeRate = parseFloat(document.getElementById('f_exchangeRate').value) || 1;
      var currency = document.getElementById('f_currency').value;

      var discountAmt = subtotal * (discount / 100);
      var afterDiscount = subtotal - discountAmt;
      var taxAmt = afterDiscount * (tax / 100);
      var total = afterDiscount + taxAmt;

      var currencySymbol = getCurrencySymbol(currency);
      document.getElementById('f_total').value = currencySymbol + Number(total).toLocaleString('en-IN');

      var totalINR = total * exchangeRate;
      document.getElementById('f_inrEquivalent').value = '₹' + Number(totalINR).toLocaleString('en-IN');

      return total;
    }

    // =============================================================
    // SAVE / DELETE PURCHASE ORDER
    // =============================================================

    function savePO(existingId) {
      var number = document.getElementById('f_number').value;
      var date = document.getElementById('f_date').value;
      var vendorId = document.getElementById('f_vendor').value;
      var expectedDelivery = document.getElementById('f_delivery').value;
      var currency = document.getElementById('f_currency').value;
      var exchangeRate = parseFloat(document.getElementById('f_exchangeRate').value) || 1;
      var paymentTerms = document.getElementById('f_paymentTerms').value;
      var status = document.getElementById('f_status').value;
      var discount = parseFloat(document.getElementById('f_discount').value) || 0;
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;
      var notes = document.getElementById('f_notes').value || '';

      if (!date || !vendorId || !expectedDelivery) {
        showToast('Please fill all required fields (Date, Vendor, Expected Delivery)', 'error');
        return;
      }

      var itemsData = [];
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      rows.forEach(function(row) {
        var itemId = row.querySelector('.item-select').value;
        var qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        var rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        if (qty > 0 && rate > 0) {
          var item = items.find(function(it) { return it.id === itemId; });
          itemsData.push({
            itemId: itemId,
            name: item ? item.name : '',
            qty: qty,
            rate: rate,
            gst: item ? item.gst : 18,
            unit: item ? item.unit : 'Pcs'
          });
        }
      });

      if (itemsData.length === 0) {
        showToast('Please add at least one item to the purchase order', 'error');
        return;
      }

      var subtotal = itemsData.reduce(function(sum, item) { return sum + (item.qty * item.rate); }, 0);
      var discountAmt = subtotal * (discount / 100);
      var afterDiscount = subtotal - discountAmt;
      var taxAmt = afterDiscount * (tax / 100);
      var total = afterDiscount + taxAmt;
      var totalINR = total * exchangeRate;

      var vendor = vendors.find(function(v) { return v.id === vendorId; });
      var vendorName = vendor ? vendor.name : '';

      // Initialize receivedQty
      var receivedQty = {};
      itemsData.forEach(function(item) {
        receivedQty[item.itemId] = 0;
      });

      if (existingId) {
        var po = purchaseOrders.find(function(x) { return x.id === existingId; });
        if (po) {
          po.number = number;
          po.date = date;
          po.vendorId = vendorId;
          po.vendorName = vendorName;
          po.vendorGST = vendor ? vendor.gstin : '';
          po.vendorState = vendor ? vendor.state : '';
          po.vendorStateCode = vendor ? vendor.stateCode : '';
          po.expectedDelivery = expectedDelivery;
          po.paymentTerms = paymentTerms;
          po.currency = currency;
          po.exchangeRate = exchangeRate;
          po.items = itemsData;
          po.discount = discount;
          po.tax = tax;
          po.total = total;
          po.totalINR = totalINR;
          po.status = status;
          po.notes = notes;
          // Preserve received quantities
          if (po.receivedQty) {
            Object.keys(po.receivedQty).forEach(function(key) {
              if (receivedQty.hasOwnProperty(key)) {
                receivedQty[key] = po.receivedQty[key] || 0;
              }
            });
          }
          po.receivedQty = receivedQty;
          showToast('Purchase Order updated successfully', 'success');
        }
      } else {
        var newPO = {
          id: 'PO-' + String(nextPONo++).padStart(3, '0'),
          number: number || 'PO/25-26/' + String(purchaseOrders.length + 1).padStart(3, '0'),
          date: date,
          vendorId: vendorId,
          vendorName: vendorName,
          vendorGST: vendor ? vendor.gstin : '',
          vendorState: vendor ? vendor.state : '',
          vendorStateCode: vendor ? vendor.stateCode : '',
          expectedDelivery: expectedDelivery,
          paymentTerms: paymentTerms,
          currency: currency,
          exchangeRate: exchangeRate,
          items: itemsData,
          discount: discount,
          tax: tax,
          total: total,
          totalINR: totalINR,
          status: status,
          receivedQty: receivedQty,
          notes: notes,
          createdAt: date
        };
        purchaseOrders.unshift(newPO);
        showToast('Purchase Order created successfully', 'success');
      }

      closeModal();
      renderPO();
    }

    function delPO(id) {
      var po = purchaseOrders.find(function(x) { return x.id === id; });
      if (!po) return;

      var modalContent = `
        ${modalHeader('Delete Purchase Order', po.number)}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${po.number}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone. All associated data will be removed.</p>
          <p class="text-amber-600 text-[11px] mt-2">Total Value: ${formatCurrency(po.total, po.currency)}</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeletePO(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeletePO(id) {
      purchaseOrders = purchaseOrders.filter(function(x) { return x.id !== id; });
      closeModal();
      renderPO();
      showToast('Purchase Order deleted successfully', 'warning');
    }

    // =============================================================
    // ACTIONS
    // =============================================================

    function sendPO(id) {
      var po = purchaseOrders.find(function(x) { return x.id === id; });
      if (!po) return;
      po.status = 'sent';
      renderPO();
      showToast('Purchase Order ' + po.number + ' sent to vendor!', 'success');
    }

    function receivePO(id) {
      var po = purchaseOrders.find(function(x) { return x.id === id; });
      if (!po) return;

      // Simple receive - mark all items as received
      var allReceived = true;
      po.items.forEach(function(item) {
        if (po.receivedQty[item.itemId] === undefined) {
          po.receivedQty[item.itemId] = 0;
        }
        if (po.receivedQty[item.itemId] < item.qty) {
          po.receivedQty[item.itemId] = item.qty;
          allReceived = false;
        }
      });

      // Check if all items are fully received
      var fullyReceived = true;
      po.items.forEach(function(item) {
        if ((po.receivedQty[item.itemId] || 0) < item.qty) {
          fullyReceived = false;
        }
      });

      if (fullyReceived) {
        po.status = 'received';
        showToast('All items received for ' + po.number + '!', 'success');
      } else {
        po.status = 'partial';
        showToast('Items marked as received for ' + po.number + ' (Partial)', 'info');
      }

      renderPO();
    }

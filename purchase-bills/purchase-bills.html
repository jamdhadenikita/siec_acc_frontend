    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // MODAL
    // =============================================================
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="modal-title text-gray-900">${title}</h3>
            ${subtitle ? '<p class="modal-subtitle mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-2">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // =============================================================
    // DROPDOWN
    // =============================================================
    document.addEventListener('click', function(e) {

            ${fld('Vendor Bill # *', '<input type="text" class="form-input" id="f_vendorBill" value="' + (e.vendorBillNumber || '') + '" placeholder="Vendor invoice number">')}

            ${fld('PO Reference', '<select class="form-input" id="f_poReference"><option value="">None</option><option ' + (e.poReference === 'PO/25-26/001' ? 'selected' : '') + '>PO/25-26/001</option><option ' + (e.poReference === 'PO/25-26/002' ? 'selected' : '') + '>PO/25-26/002</option><option ' + (e.poReference === 'PO/25-26/003' ? 'selected' : '') + '>PO/25-26/003</option><option ' + (e.poReference === 'PO/25-26/004' ? 'selected' : '') + '>PO/25-26/004</option><option ' + (e.poReference === 'PO/25-26/005' ? 'selected' : '') + '>PO/25-26/005</option></select>')}
          </div>

          <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-2">
            ${fld('Date *', '<input type="date" class="form-input" id="f_date" value="' + e.date + '">')}
            ${fld('Due Date *', '<input type="date" class="form-input" id="f_dueDate" value="' + e.dueDate + '">')}
            ${fld('Status', '<select class="form-input" id="f_status"><option ' + (e.status === 'draft' ? 'selected' : '') + ' value="draft">Draft</option><option ' + (e.status === 'received' ? 'selected' : '') + ' value="received">Received</option><option ' + (e.status === 'partial' ? 'selected' : '') + ' value="partial">Partially Paid</option><option ' + (e.status === 'paid' ? 'selected' : '') + ' value="paid">Paid</option><option ' + (e.status === 'overdue' ? 'selected' : '') + ' value="overdue">Overdue</option></select>')}
          </div>

          <!-- Line Items -->
          <div class="mt-3">
            <div class="flex items-center justify-between mb-1.5">
              <label class="form-label mb-0">Line Items</label>
              <button onclick="addLineItem()" class="text-[10px] font-semibold text-primary hover:underline flex items-center gap-1">
                ${iconPlus()} Add Item
              </button>
            </div>
            <div class="border border-gray-200 rounded-lg overflow-hidden">
              <table class="w-full text-xs" id="lineItemsTable">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-2 py-1.5 text-left font-semibold text-gray-600">Item</th>
                    <th class="px-2 py-1.5 text-center font-semibold text-gray-600">Qty</th>
                    <th class="px-2 py-1.5 text-center font-semibold text-gray-600">Rate</th>
                    <th class="px-2 py-1.5 text-center font-semibold text-gray-600" style="width:36px;">Action</th>
                  </tr>
                </thead>
                <tbody id="lineItemsBody">
                  ${lineItemsHtml || '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products/services.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Footer Fields -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
            ${fld('Discount (%)', '<input type="number" class="form-input" id="f_discount" value="' + e.discount + '" placeholder="0" onchange="calcBillTotal()">')}
            ${fld('Tax Rate (%)', '<select class="form-input" id="f_tax" onchange="calcBillTotal()"><option ' + (e.tax == 0 ? 'selected' : '') + '>0</option><option ' + (e.tax == 5 ? 'selected' : '') + '>5</option><option ' + (e.tax == 12 ? 'selected' : '') + '>12</option><option ' + (e.tax == 18 ? 'selected' : '') + '>18</option><option ' + (e.tax == 28 ? 'selected' : '') + '>28</option></select>')}
            ${fld('Total Amount', '<input type="text" class="form-input" id="f_total" value="' + (e.total ? money(e.total) : '₹0') + '" disabled style="font-weight:bold;color:#6da84c;">')}
          </div>

          ${fld('Notes', '<textarea rows="2" class="form-input" id="f_notes" placeholder="Additional notes">' + (e.notes || '') + '</textarea>')}
        </div>
        ${modalFooter(isEdit ? 'Update Bill' : 'Save Bill', 'onclick="saveBill(\'' + (isEdit ? e.id : '') + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-4xl' });
      setTimeout(function() { calcBillTotal(); }, 100);
    }

    // =============================================================
    // LINE ITEM FUNCTIONS
    // =============================================================

    function addLineItem() {
      var tbody = document.getElementById('lineItemsBody');
      if (!tbody) return;
      var emptyRow = tbody.querySelector('tr td[colspan]');
      if (emptyRow) tbody.innerHTML = '';

      var idx = tbody.children.length;
      var row = document.createElement('tr');
      row.className = 'border-b border-gray-100 line-item-row';
      row.innerHTML = `
        <td class="px-2 py-1">
          <select class="form-input text-[10px] item-select" data-idx="${idx}">
            ${items.map(function(it) { return '<option value="' + it.id + '">' + it.name + '</option>'; }).join('')}
          </select>
        </td>
        <td class="px-2 py-1">
          <input type="number" class="form-input text-[10px] item-qty" value="1" data-idx="${idx}" placeholder="Qty" onchange="calcBillTotal()">
        </td>
        <td class="px-2 py-1">
          <input type="number" class="form-input text-[10px] item-rate" value="0" data-idx="${idx}" placeholder="Rate" onchange="calcBillTotal()">
        </td>
        <td class="px-2 py-1 text-center">
          <button onclick="removeLineItem(this)" class="text-red-500 hover:text-red-700 transition">${iconX()}</button>
        </td>
      `;
      tbody.appendChild(row);

      var select = row.querySelector('.item-select');
      select.addEventListener('change', function() {
        var selectedItem = items.find(function(it) { return it.id === this.value; });
        var rateInput = this.closest('tr').querySelector('.item-rate');
        if (selectedItem && rateInput) {
          rateInput.value = selectedItem.price;
          calcBillTotal();
        }
      });
      select.dispatchEvent(new Event('change'));
    }

    function removeLineItem(btn) {
      var row = btn.closest('tr');
      if (row) row.remove();
      var tbody = document.getElementById('lineItemsBody');
      if (tbody && tbody.children.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products/services.</td></tr>';
      }
      calcBillTotal();
    }

    function updateVendorDetails() {
      var vendorId = document.getElementById('f_vendor').value;
      var vendor = vendors.find(function(v) { return v.id === vendorId; });
      if (vendor) {
        // Could auto-fill email for payment automation
      }
    }

    function calcBillTotal() {
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      var subtotal = 0;
      rows.forEach(function(row) {
        var qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        var rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        subtotal += qty * rate;
      });

      var discount = parseFloat(document.getElementById('f_discount').value) || 0;
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;

      var discountAmt = subtotal * (discount / 100);
      var afterDiscount = subtotal - discountAmt;
      var taxAmt = afterDiscount * (tax / 100);
      var total = afterDiscount + taxAmt;

      document.getElementById('f_total').value = money(total);
      return total;
    }

    // =============================================================
    // SAVE / DELETE BILL
    // =============================================================

    function saveBill(existingId) {
      var number = document.getElementById('f_number').value;
      var vendorBillNumber = document.getElementById('f_vendorBill').value.trim();
      var date = document.getElementById('f_date').value;
      var dueDate = document.getElementById('f_dueDate').value;
      var vendorId = document.getElementById('f_vendor').value;
      var poReference = document.getElementById('f_poReference').value || '';
      var status = document.getElementById('f_status').value;
      var discount = parseFloat(document.getElementById('f_discount').value) || 0;
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;
      var notes = document.getElementById('f_notes').value || '';

      if (!date || !vendorId || !dueDate || !vendorBillNumber) {
        showToast('Please fill all required fields (Date, Vendor, Due Date, Vendor Bill #)', 'error');
        return;
      }

      var itemsData = [];
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      rows.forEach(function(row) {
        var itemId = row.querySelector('.item-select').value;
        var qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        var rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        if (qty > 0 && rate > 0) {
          var item = items.find(function(it) { return it.id === itemId; });
          itemsData.push({
            itemId: itemId,
            name: item ? item.name : '',
            qty: qty,
            rate: rate,
            gst: item ? item.gst : 18,
            unit: item ? item.unit : 'Pcs'
          });
        }
      });

      if (itemsData.length === 0) {
        showToast('Please add at least one item to the bill', 'error');
        return;
      }

      var subtotal = itemsData.reduce(function(sum, item) { return sum + (item.qty * item.rate); }, 0);
      var discountAmt = subtotal * (discount / 100);
      var afterDiscount = subtotal - discountAmt;
      var taxAmt = afterDiscount * (tax / 100);
      var total = afterDiscount + taxAmt;

      var vendor = vendors.find(function(v) { return v.id === vendorId; });
      var vendorName = vendor ? vendor.name : '';
      var vendorEmail = vendor ? vendor.email : '';
      var vendorGST = vendor ? vendor.gstin : '';

      if (existingId) {
        var bill = purchaseBills.find(function(x) { return x.id === existingId; });
        if (bill) {
          bill.number = number;
          bill.vendorBillNumber = vendorBillNumber;
          bill.date = date;
          bill.dueDate = dueDate;
          bill.vendorId = vendorId;
          bill.vendorName = vendorName;
          bill.vendorEmail = vendorEmail;
          bill.vendorGST = vendorGST;
          bill.poReference = poReference;
          bill.items = itemsData;
          bill.discount = discount;
          bill.tax = tax;
          bill.total = total;
          bill.status = status;
          bill.notes = notes;
          showToast('Purchase Bill updated successfully', 'success');
        }
      } else {
        var newBill = {
          id: 'PB-' + String(nextBillNo++).padStart(3, '0'),
          number: number || 'PUR/25-26/' + String(purchaseBills.length + 1).padStart(3, '0'),
          vendorBillNumber: vendorBillNumber,
          date: date,
          dueDate: dueDate,
          vendorId: vendorId,
          vendorName: vendorName,
          vendorEmail: vendorEmail,
          vendorGST: vendorGST,
          poReference: poReference,
          items: itemsData,
          discount: discount,
          tax: tax,
          total: total,
          paid: 0,
          status: status,
          notes: notes,
          paymentHistory: [],
          createdAt: date
        };
        purchaseBills.unshift(newBill);
        showToast('Purchase Bill created successfully', 'success');
      }

      closeModal();
      renderBills();
    }

    function delBill(id) {
      var bill = purchaseBills.find(function(x) { return x.id === id; });
      if (!bill) return;

      var modalContent = `
        ${modalHeader('Delete Purchase Bill', bill.number)}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${bill.number}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone. All associated data will be removed.</p>
          <p class="text-amber-600 text-[11px] mt-2">Total Value: ${money(bill.total)}</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteBill(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteBill(id) {
      purchaseBills = purchaseBills.filter(function(x) { return x.id !== id; });
      closeModal();
      renderBills();
      showToast('Purchase Bill deleted successfully', 'warning');
    }

    // =============================================================
    // PAYMENT FUNCTIONS (Enhancement #1 — Payment Email Automation)
    // =============================================================

    function recordPayment(id) {
      var bill = purchaseBills.find(function(x) { return x.id === id; });
      if (!bill) return;

      var balance = bill.total - bill.paid;
      var modalContent = `
        ${modalHeader('Record Payment', bill.number + ' — Balance: ' + money(balance))}
        <div class="px-5 py-4">
          <div class="grid grid-cols-2 gap-3">
            ${fld('Amount *', '<input type="number" class="form-input" id="p_amount" value="' + balance + '" step="0.01" placeholder="Payment amount">')}
            ${fld('Payment Date *', '<input type="date" class="form-input" id="p_date" value="' + new Date().toISOString().split('T')[0] + '">')}
            ${fld('Payment Mode *', '<select class="form-input" id="p_mode"><option>Bank Transfer</option><option>UPI</option><option>Cheque</option><option>Cash</option><option>NEFT</option><option>RTGS</option><option>Credit Card</option><option>Debit Card</option></select>')}
            ${fld('Reference Number', '<input type="text" class="form-input" id="p_reference" placeholder="Transaction/Cheque reference">')}
          </div>

          <div class="mt-3 p-3 bg-primary-soft rounded-lg border border-primary/20">
            <div class="flex items-start gap-2">
              ${iconMail()}
              <div>
                <p class="text-[11px] font-semibold text-primary">📧 Payment Email Automation (Enhancement #1)</p>
                <p class="text-[10px] text-gray-500">An email will be automatically sent to <b>${bill.vendorEmail || bill.vendorName}</b> with payment details and receipt.</p>
              </div>
            </div>
          </div>
        </div>
        ${modalFooter('Record Payment & Send Email', 'onclick="savePayment(\'' + id + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-lg' });
    }

    function savePayment(id) {
      var bill = purchaseBills.find(function(x) { return x.id === id; });
      if (!bill) return;

      var amount = parseFloat(document.getElementById('p_amount').value);
      var date = document.getElementById('p_date').value;
      var mode = document.getElementById('p_mode').value;
      var reference = document.getElementById('p_reference').value || '';

      if (!amount || amount <= 0) {
        showToast('Please enter a valid payment amount', 'error');
        return;
      }

      var balance = bill.total - bill.paid;
      if (amount > balance) {
        showToast('Payment amount exceeds balance due: ' + money(balance), 'error');
        return;
      }

      // Record payment
      bill.paid = (bill.paid || 0) + amount;
      bill.paymentHistory.push({
        date: date,
        amount: amount,
        mode: mode,
        reference: reference
      });

      // Update status
      if (bill.paid >= bill.total) {
        bill.status = 'paid';
      } else if (bill.paid > 0) {
        bill.status = 'partial';
      }

      closeModal();
      renderBills();

      // =============================================================
      // ENHANCEMENT #1 — Payment Email Automation
      // =============================================================
      // Email is automatically triggered when payment is saved
      var vendorEmail = bill.vendorEmail || '';
      if (vendorEmail) {
        // In a real implementation, this would send an actual email via SMTP
        // For demo, we show a toast notification
        showToast('📧 Payment email automation triggered! Email sent to ' + vendorEmail, 'success');

        // Log the email details
        console.log('========================================');
        console.log('📧 PAYMENT EMAIL AUTOMATION (Enhancement #1)');
        console.log('========================================');
        console.log('To:', vendorEmail);
        console.log('Subject: Payment Confirmation - ' + bill.number);
        console.log('Message:');
        console.log('Dear Vendor,');
        console.log('');
        console.log('This is to confirm that we have processed your payment.');
        console.log('');
        console.log('Payment Details:');
        console.log('- Amount: ' + money(amount));
        console.log('- Date: ' + date);
        console.log('- Bill/Reference: ' + bill.number);
        console.log('- Mode of Payment: ' + mode);
        console.log('- Reference: ' + reference);
        console.log('');
        console.log('Please find the payment receipt attached.');
        console.log('');
        console.log('Regards,');
        console.log('Kunash Media Team');
        console.log('========================================');

        // Show email preview in a separate toast
        setTimeout(function() {
          showToast('📧 Email sent to ' + vendorEmail + ' — Payment confirmation', 'info');
        }, 500);
      } else {
        showToast('⚠️ No email address found for vendor. Please add email to send payment confirmation.', 'warning');
      }
    }

    // Manual email send (for existing payments)
    function sendPaymentEmail(id) {
      var bill = purchaseBills.find(function(x) { return x.id === id; });
      if (!bill) return;

      var vendorEmail = bill.vendorEmail || '';
      if (vendorEmail) {
        showToast('📧 Sending payment confirmation email to ' + vendorEmail + '...', 'info');
        setTimeout(function() {
          showToast('✅ Payment email sent to ' + vendorEmail, 'success');
        }, 1000);
      } else {
        showToast('⚠️ No email address found for vendor. Please add email in vendor master.', 'warning');
      }
    }

              onkeyup="filterBills()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;

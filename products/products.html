<style>
  /* Form styles */
  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
    background: #ffffff;
  }
  .form-label {
    font-size: 11.5px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 4px;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 10.5px; color: #9ca3af; margin-top: 3px; }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }

  /* Stats card */
  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }

  /* Table row hover */
  .table-row-hover:hover {
    background: #f8fafc;
  }

  /* Modal tabs */
  .modal-tab-btn {
    transition: all 0.2s ease;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    color: #6b7280;
    cursor: pointer;
    background: transparent;
  }
  .modal-tab-btn.active {
    color: #6da84c;
    border-bottom-color: #6da84c;
  }
  .modal-tab-btn:hover:not(.active) {
    color: #1f2937;
    border-bottom-color: #d1d5db;
  }
  .modal-tab-panel { display: none; }
  .modal-tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  /* Action buttons */
  .btn-icon-action {
    transition: all 0.15s ease;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }

  /* Vendor price row */
  .vendor-price-row:hover {
    background: #f8fafc;
  }

  /* Toast */
  .toast {
    animation: fadeIn 0.2s ease;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  /* Scrollbar for modal */
  .modal-scroll {
    max-height: 60vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .modal-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }

  /* Vendor price table in modal */
  .vendor-price-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  .vendor-price-table th {
    background: #f8fafc;
    text-align: left;
    padding: 6px 10px;
    font-weight: 600;
    color: #475569;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid #e5e7eb;
  }
  .vendor-price-table td {
    padding: 4px 10px;
    border-bottom: 1px solid #f1f5f9;
  }
  .vendor-price-table .vendor-price-row td {
    padding: 4px 10px;
  }

  /* Empty state */
  .empty-icon-svg {
    opacity: 0.2;
    width: 48px;
    height: 48px;
    color: #94a3b8;
  }
</style>

    // ---------- Toast System ----------
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // ---------- Modal System ----------
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full ${opts.width || 'max-w-3xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-6 py-5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="text-lg font-bold text-gray-900">${title}</h3>
            ${subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `

            <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `

          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // ---------- Dropdown ----------
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      }
    });

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

    function money(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

      var map = { green: 'badge-green', amber: 'badge-amber', red: 'badge-red', gray: 'badge-gray' };
      var dot = { green: 'badge-dot-green', amber: 'badge-dot-amber', red: 'badge-dot-red', gray: 'badge-dot-gray' };
      return '<span class="badge ' + map[color] + '"><span class="badge-dot ' + dot[color] + '"></span>' + text + '</span>';
    }

      return qty > 20 ? 'green' : qty > reorder ? 'amber' : 'red';

      var v = vendors.find(function(x) { return x.id === id; });
      return v ? v.name : id;

      var w = warehouses.find(function(x) { return x.id === id; });
      return w ? w.name : id;

    function renderStats() {
      document.getElementById('totalItems').textContent = items.length;
      var uniqueCats = new Set(items.map(function(i) { return i.category; }));
      document.getElementById('totalCategories').textContent = uniqueCats.size;
      var lowStock = items.filter(function(i) { return i.status === 'amber' || i.status === 'red'; });
      document.getElementById('lowStockCount').textContent = lowStock.length;
      var totalVal = items.reduce(function(sum, i) { return sum + (i.stock * i.sellingPrice); }, 0);
      document.getElementById('totalStockValue').textContent = money(totalVal);

      var filterCat = document.getElementById('filterCategory');
      var currentVal = filterCat.value;
      filterCat.innerHTML = '<option value="all">All Categories</option>';
      var sortedCats = Array.from(uniqueCats).sort();
      sortedCats.forEach(function(c) {
        filterCat.innerHTML += '<option value="' + c + '">' + c + '</option>';
      });
      filterCat.value = currentVal;
    }

    function getFilteredItems() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.toLowerCase() : '';
      var cat = document.getElementById('filterCategory').value || 'all';
      var status = document.getElementById('filterStatus').value || 'all';

      return items.filter(function(it) {
        var matchSearch = it.name.toLowerCase().indexOf(q) !== -1 ||
          it.sku.toLowerCase().indexOf(q) !== -1 ||
          it.id.toLowerCase().indexOf(q) !== -1 ||
          it.hsn.indexOf(q) !== -1;
        var matchCat = cat === 'all' || it.category === cat;
        var matchStatus = status === 'all' || it.status === status;
        return matchSearch && matchCat && matchStatus;
      });

    function collectVendorPrices() {
      var prices = [];
      var rows = document.querySelectorAll('#vendorPriceBody .vendor-price-row');
      rows.forEach(function(row) {
        var vendor = row.querySelector('.vendor-vendor') ? row.querySelector('.vendor-vendor').value : null;
        var price = row.querySelector('.vendor-price') ? parseFloat(row.querySelector('.vendor-price').value) : null;
        var currency = row.querySelector('.vendor-currency') ? row.querySelector('.vendor-currency').value || 'INR' : 'INR';
        var date = row.querySelector('.vendor-date') ? row.querySelector('.vendor-date').value || new Date().toISOString().split('T')[0] : new Date().toISOString().split('T')[0];
        if (vendor && price) {
          prices.push({ vendorId: vendor, price: price, currency: currency, date: date });
        }
      });
      return prices;
    }

    // =============================================================
    // SAVE / DELETE ITEM
    // =============================================================

    function saveItem(existingId) {
      var name = document.getElementById('f_name') ? document.getElementById('f_name').value.trim() : '';
      var sku = document.getElementById('f_sku') ? document.getElementById('f_sku').value.trim() : '';
      var category = document.getElementById('f_category') ? document.getElementById('f_category').value || 'General' : 'General';
      var hsn = document.getElementById('f_hsn') ? document.getElementById('f_hsn').value.trim() : '';
      var unit = document.getElementById('f_unit') ? document.getElementById('f_unit').value || 'Pcs' : 'Pcs';
      var sellingPrice = document.getElementById('f_selling') ? parseFloat(document.getElementById('f_selling').value) || 0 : 0;
      var purchasePrice = document.getElementById('f_purchase') ? parseFloat(document.getElementById('f_purchase').value) || 0 : 0;
      var gstRate = document.getElementById('f_gst') ? parseInt(document.getElementById('f_gst').value) || 18 : 18;
      var stock = document.getElementById('f_stock') ? parseInt(document.getElementById('f_stock').value) || 0 : 0;
      var reorderLevel = document.getElementById('f_reorder') ? parseInt(document.getElementById('f_reorder').value) || 5 : 5;
      var warehouse = document.getElementById('f_warehouse') ? document.getElementById('f_warehouse').value || 'WH-001' : 'WH-001';
      var description = document.getElementById('f_description') ? document.getElementById('f_description').value || '' : '';
      var serialBatchRadio = document.querySelector('input[name="serialBatch"]:checked');
      var serialBatch = serialBatchRadio ? serialBatchRadio.value === 'true' : false;
      var vendorPrices = collectVendorPrices();

      if (!name || !sku || !hsn) {
        showToast('Please fill all required fields (Name, SKU, HSN)', 'error');
        return;
      }

      if (existingId) {
        var it = items.find(function(x) { return x.id === existingId; });
        if (it) {
          it.name = name;
          it.sku = sku;
          it.category = category;
          it.hsn = hsn;
          it.unit = unit;
          it.sellingPrice = sellingPrice;
          it.purchasePrice = purchasePrice;
          it.gstRate = gstRate;
          it.stock = stock;
          it.reorderLevel = reorderLevel;
          it.warehouse = warehouse;
          it.description = description;
          it.serialBatch = serialBatch;
          it.vendorPrices = vendorPrices;
          it.status = stockStatus(stock, reorderLevel);
          showToast('Item updated successfully', 'success');
        }
      } else {
        var newItem = {
          id: 'ITM-' + (nextItemNo++),
          name: name,
          sku: sku,
          category: category,
          hsn: hsn,
          unit: unit,
          sellingPrice: sellingPrice,
          purchasePrice: purchasePrice,
          gstRate: gstRate,
          stock: stock,
          reorderLevel: reorderLevel,
          warehouse: warehouse,
          description: description,
          serialBatch: serialBatch,
          vendorPrices: vendorPrices,
          status: stockStatus(stock, reorderLevel)
        };
        items.unshift(newItem);
        showToast('Item added successfully', 'success');
      }

      closeModal();
      renderItems();
    }

    function delItem(id) {
      var it = items.find(function(x) { return x.id === id; });
      if (!it) return;

      var modalContent = `
        ${modalHeader('Delete Item', it.name)}
        <div class="px-6 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${it.name}</b>?</p>
          <p class="text-gray-400 text-[12px] mt-1">This action cannot be undone. All associated transactions will be affected.</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteItem(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteItem(id) {
      items = items.filter(function(x) { return x.id !== id; });
      closeModal();
      renderItems();
      showToast('Item deleted successfully', 'warning');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    // Add search input to top bar
    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search items by name, SKU, HSN…"
              onkeyup="filterItems()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    renderItems();

    console.log('Items Module Loaded Successfully — No Emojis, Only SVG Icons');
    console.log('Total Items:', items.length);
    console.log('Categories:', categories);
    console.log('Vendor Price List (Enhancement #4) active');

  </script>

</body>

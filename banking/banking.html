<style>
  body { font-size: 12px; background: #f3f4f6; }

  .form-input {
    width: 100%; border: 1px solid #e5e7eb; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; outline: none;
    transition: all 0.2s; background: #fafafa; color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.12);
    background: #ffffff;
  }
  .form-label {
    font-size: 10px; font-weight: 600; color: #374151;
    display: block; margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 10px; color: #9ca3af; margin-top: 2px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }
  .badge-dot-purple { background: #8b5cf6; }

  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    padding: 10px 14px !important;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-card .stat-label {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: #6b7280;
  }
  .stat-card .stat-value {
    font-size: 17px; font-weight: 700; color: #1a1a2e; margin-top: 2px;
  }

  .table-row-hover:hover { background: #f8fafc; }

  .btn-icon-action {
    transition: all 0.15s ease; width: 28px; height: 28px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #94a3b8; background: transparent; border: none; cursor: pointer;
  }
  .btn-icon-action:hover { background: #f1f5f9; color: #6da84c; }
  .btn-icon-action.danger:hover { background: #fee2e2; color: #ef4444; }
  .btn-icon-action.primary:hover { background: #eef5e8; color: #6da84c; }

  .toast { animation: fadeIn 0.2s ease; font-size: 12px; }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  .modal-scroll { max-height: 60vh; overflow-y: auto; }
  .modal-scroll::-webkit-scrollbar { width: 4px; }
  .modal-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

  .page-breadcrumb {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: #6da84c;
  }

  /* Hero bank card — single */
  .hero-bank {
    background: linear-gradient(135deg, #0f2a1a, #1a3a28);
    border-radius: 14px;
    padding: 22px 26px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .hero-bank::after {
    content: '';
    position: absolute;
    width: 300px; height: 300px;

  .hero-bank .hb-balance {

  .hero-bank .hb-sub {

  .hero-bank .hb-stat {

  .hero-bank .hb-stat-label {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: rgba(255,255,255,0.55);
  }
  .hero-bank .hb-stat-value {
    font-size: 15px; font-weight: 700; margin-top: 2px;

  /* Reconciliation row */
  .recon-row { border-left: 3px solid transparent; }
  .recon-row.matched { border-left-color: #22c55e; }
  .recon-row.unmatched { border-left-color: #f59e0b; }

  /* Tab buttons */
  .page-tab-btn {
    transition: all 0.2s ease; padding: 10px 16px; font-size: 12px;
    font-weight: 500; border-bottom: 2px solid transparent;
    color: #6b7280; cursor: pointer; background: transparent; white-space: nowrap;

  .page-tab-btn.active {
    color: #6da84c; border-bottom-color: #6da84c; font-weight: 600;
  }
  .page-tab-btn:hover:not(.active) { color: #1f2937; border-bottom-color: #d1d5db; }
  .page-tab-panel { display: none; }
  .page-tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

  /* Inline filter */
  .inline-filter-select {
    border: 1px solid #e5e7eb; background: #fff; color: #374151;
    font-size: 11px; font-weight: 600; border-radius: 8px;
    padding: 6px 10px; outline: none; cursor: pointer; max-width: 160px;
  }
  .inline-filter-select:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
  }

  /* Upload area */
  .upload-area {
    border: 2px dashed #d1d5db; border-radius: 12px;
    padding: 30px 20px; text-align: center;
    transition: all 0.2s; cursor: pointer; background: #fafafa;
  }
  .upload-area:hover {
    border-color: #6da84c; background: #f8fdf5;
  }

  /* Match panel */
  .match-panel {
    border: 2px dashed #d1d5db; border-radius: 10px;
    padding: 12px; background: #fafbfc;
    transition: all 0.15s ease;
  }
  .match-panel:hover { border-color: #6da84c; }
  .match-panel.best { border-color: #22c55e; background: #f0fdf4; }
</style>
</head>

  <script>
    // =============================================================

    NavSidebar.init({

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = { success:'bg-green-600', info:'bg-primary', warning:'bg-amber-600', error:'bg-red-600' };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // MODAL
    // =============================================================
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-2xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalRoot').innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="text-base font-bold text-gray-900">${title}</h3>
            ${subtitle ? '<p class="text-[11px] text-gray-500 mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              <i class="fa-solid fa-floppy-disk"></i> ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-2">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    // =============================================================
    // HELPERS
    // =============================================================
    function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }

    function formatDate(d) {
      if (!d) return '—';
      var date = new Date(d);
      if (isNaN(date.getTime())) return d;
      return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function statusBadge(status) {
      var map = { reconciled: 'green', matched: 'green', unmatched: 'amber', pending: 'amber', cleared: 'blue', bounced: 'red', manual: 'purple' };
      var labels = { reconciled: 'Reconciled', matched: 'Matched', unmatched: 'Unmatched', pending: 'Pending', cleared: 'Cleared', bounced: 'Bounced', manual: 'Manual' };
      return '<span class="badge badge-' + (map[status] || 'gray') + '">' + (labels[status] || status) + '</span>';
    }

    // =============================================================
    // SINGLE BANK ACCOUNT
    // =============================================================
    var bankAccount = {
      id: 'BA-001',
      name: 'Kunash Media — Current Account',
      bankName: 'HDFC Bank',
      accountNumber: '50100XXXXXX1234',
      ifsc: 'HDFC0000123',
      branch: 'BKC, Mumbai',
      type: 'Current',
      currency: 'INR',
      openingBalance: 750000,
      currentBalance: 783450,
      lastImportAt: null
    };

    // Bank statement transactions (imported from bank)
    var bankTransactions = [
      { id: 'BT-001', date: '2026-01-25', description: 'NEFT CR XYZ RETAIL STORE', reference: 'NEFT-20260125-001', debit: 0, credit: 100000, balance: 850000, matched: true, matchedWith: 'CP-001', matchType: 'receipt' },
      { id: 'BT-002', date: '2026-01-27', description: 'NEFT DR GLOBAL IMPORTS INC', reference: 'NEFT-20260127-045', debit: 50000, credit: 0, balance: 800000, matched: true, matchedWith: 'VP-001', matchType: 'payment' },
      { id: 'BT-003', date: '2026-01-28', description: 'UPI CR RAHUL SHARMA', reference: 'UPI-9876543210-1234', debit: 0, credit: 63700, balance: 863700, matched: true, matchedWith: 'CP-002', matchType: 'receipt' },
      { id: 'BT-004', date: '2026-02-01', description: 'IMPS DR TECH COMPONENTS', reference: 'IMPS-20260201-078', debit: 95000, credit: 0, balance: 768700, matched: false, matchedWith: null, matchType: null },
      { id: 'BT-005', date: '2026-02-05', description: 'BANK CHARGES', reference: 'CHG-20260205', debit: 250, credit: 0, balance: 768450, matched: false, matchedWith: null, matchType: null },
      { id: 'BT-006', date: '2026-02-08', description: 'NEFT CR PRIYA PATEL', reference: 'NEFT-20260208-022', debit: 0, credit: 15000, balance: 783450, matched: false, matchedWith: null, matchType: null },
      { id: 'BT-007', date: '2026-02-10', description: 'IMPS DR ABC PROPERTIES', reference: 'IMPS-20260210-101', debit: 85000, credit: 0, balance: 698450, matched: false, matchedWith: null, matchType: null }
    ];

    // ERP records that can be matched
    var erpRecords = [
      { id: 'CP-001', type: 'receipt',  label: 'RCPT/25-26/001 — XYZ Retail Store', amount: 100000, date: '2026-01-25', ref: 'NEFT-20260125-001' },
      { id: 'CP-002', type: 'receipt',  label: 'RCPT/25-26/002 — Rahul Sharma', amount: 63700, date: '2026-01-28', ref: 'UPI-9876543210-1234' },
      { id: 'CP-003', type: 'receipt',  label: 'RCPT/25-26/003 — Global Exports Ltd.', amount: 3799, date: '2026-02-01', ref: 'NEFT-20260201-005' },
      { id: 'CP-005', type: 'receipt',  label: 'RCPT/25-26/005 — Priya Patel', amount: 15000, date: '2026-02-08', ref: 'CASH-001' },
      { id: 'VP-001', type: 'payment',  label: 'PAY/25-26/001 — Global Imports Inc.', amount: 50000, date: '2026-01-27', ref: 'NEFT-20260127-045' },
      { id: 'VP-002', type: 'payment',  label: 'PAY/25-26/002 — Tech Components Ltd.', amount: 95000, date: '2026-02-01', ref: 'IMPS-20260201-078' },
      { id: 'EXP-001', type: 'expense', label: 'EXP-001 — Office Rent', amount: 85000, date: '2026-02-10', ref: 'IMPS-20260210-101' },
      { id: 'EXP-005', type: 'expense', label: 'EXP-005 — Utilities (MSEB)', amount: 18750, date: '2026-02-12', ref: '' }
    ];

    // Bank rules
    var bankRules = [
      { id: 'R-001', name: 'NEFT Receipts', condition: 'Description contains "NEFT CR"', action: 'Categorize as Receipts', matchType: 'receipt', enabled: true },
      { id: 'R-002', name: 'NEFT Payments', condition: 'Description contains "NEFT DR"', action: 'Categorize as Payments', matchType: 'payment', enabled: true },

    // =============================================================
    // RENDER HERO BANK CARD
    // =============================================================
    function renderHeroBank() {
      var matched = bankTransactions.filter(function (t) { return t.matched; }).length;
      var unmatched = bankTransactions.length - matched;

      var html = `
        <div class="flex flex-wrap items-start justify-between gap-4 mb-4" style="position:relative;z-index:1;">
          <div>
            <div class="hb-label">${bankAccount.type} Account</div>

            <div class="hb-number">${bankAccount.bankName} · ${bankAccount.accountNumber} · IFSC ${bankAccount.ifsc}</div>
          </div>
          <div style="text-align:right;">

    // =============================================================
    // MATCH SUGGESTIONS
    // =============================================================
    function findSuggestedMatches(bankTxn) {
      var amount = bankTxn.credit > 0 ? bankTxn.credit : bankTxn.debit;

      return erpRecords.filter(function (r) {
        // Already matched?
        var alreadyMatched = bankTransactions.some(function (bt) { return bt.matchedWith === r.id; });
        if (alreadyMatched) return false;
        // Amount match (within 5%)
        if (Math.abs(r.amount - amount) > 5) return false;
        return true;
      }).map(function (r) {
        var score = 0;
        if (r.ref && r.ref === bankTxn.reference) score += 100;
        if (Math.abs(r.amount - amount) < 1) score += 50;
        if (r.date === bankTxn.date) score += 30;
        return { record: r, score: score };
      }).sort(function (a, b) { return b.score - a.score; });
    }

    // =============================================================
    // MATCH MODAL
    // =============================================================
    function openMatchModal(bankTxnId) {
      var txn = bankTransactions.find(function (t) { return t.id === bankTxnId; });

      var amount = txn.credit > 0 ? txn.credit : txn.debit;

      var suggestionsHtml = suggestions.length === 0 ?
        '<div class="text-center py-6 text-gray-400 text-xs">No ERP records found matching this transaction.<br>You can create a new record instead.</div>' :
        suggestions.map(function (s, idx) {
          var r = s.record;
          var isBest = idx === 0 && s.score >= 80;
          return `
            <div class="match-panel ${isBest ? 'best' : ''} mb-2 cursor-pointer" onclick="confirmMatch('${txn.id}', '${r.id}')">
              <div class="flex items-center justify-between">

                  <div class="text-xs font-semibold text-gray-800">${r.label}</div>
                  <div class="text-[10px] text-gray-500 mt-0.5">${formatDate(r.date)} · ${r.type} ${r.ref ? '· ' + r.ref : ''}</div>
                </div>
                <div class="text-right">
                  <div class="text-sm font-bold text-primary">${money(r.amount)}</div>
                  ${isBest ? '<div class="text-[9px] text-green-600 font-bold mt-0.5">BEST MATCH</div>' : ''}
                </div>
              </div>
            </div>`;
        }).join('');

      var html = `

          </div>

          <div class="text-[10px] font-bold uppercase tracking-wide text-gray-500 mb-2">Suggested ERP Records</div>
          ${suggestionsHtml}

          <div class="mt-4 pt-3 border-t border-gray-100">
            <button onclick="createFromBankTxn('${txn.id}')" class="w-full inline-flex items-center justify-center gap-1.5 bg-white border border-dashed border-gray-300 hover:border-primary hover:bg-primary-soft text-gray-700 hover:text-primary text-[11px] font-semibold px-3 py-2.5 rounded-lg transition">

              Create New ERP Record from This Transaction
            </button>

        </div>

      `;

      openModal(html, { width: 'max-w-2xl' });

    function confirmMatch(bankTxnId, erpRecordId) {
      var txn = bankTransactions.find(function (t) { return t.id === bankTxnId; });
      var erp = erpRecords.find(function (r) { return r.id === erpRecordId; });
      if (!txn || !erp) return;

      txn.matched = true;
      txn.matchedWith = erp.id;
      txn.matchType = erp.type;

      closeModal();
      renderReconciliation();
      renderStats();
      showToast('✓ Matched: ' + txn.description + ' ↔ ' + erp.label, 'success');
    }

    function unmatchTransaction(bankTxnId) {
      var txn = bankTransactions.find(function (t) { return t.id === bankTxnId; });
      if (!txn) return;
      txn.matched = false;
      txn.matchedWith = null;
      txn.matchType = null;
      renderReconciliation();
      renderStats();
      showToast('Unmatched successfully', 'info');
    }

    function createFromBankTxn(bankTxnId) {
      closeModal();
      showToast('Redirecting to create new record…', 'info');
    }

    // =============================================================
    // AUTO RECONCILE
    // =============================================================
    function autoReconcileAll() {
      var matchedCount = 0;

      bankTransactions.filter(function (t) { return !t.matched; }).forEach(function (txn) {
        var suggestions = findSuggestedMatches(txn);
        if (suggestions.length > 0 && suggestions[0].score >= 80) {
          txn.matched = true;
          txn.matchedWith = suggestions[0].record.id;
          txn.matchType = suggestions[0].record.type;
          matchedCount++;
        }
      });

      renderReconciliation();
      renderStats();

      if (matchedCount > 0) {
        showToast('✓ Auto-reconciled ' + matchedCount + ' transaction(s)', 'success');
      } else {
        showToast('No high-confidence matches found. Use manual matching.', 'warning');
      }
    }

    function renderReports() {
      var totalCredits = bankTransactions.reduce(function (s, t) { return s + t.credit; }, 0);

          <!-- BANK BOOK -->
          <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
            <div class="px-4 py-2.5 border-b border-gray-100 bg-gray-50">
              <div class="text-sm font-bold text-gray-800">
                <i class="fa-solid fa-book text-primary mr-1.5"></i>Bank Book Summary
              </div>
            </div>
            <table class="w-full text-xs">
              <tbody>
                <tr><td class="px-3 py-2 text-gray-500">Opening Balance</td><td class="px-3 py-2 text-right font-mono font-semibold">${money(bankAccount.openingBalance)}</td></tr>
                <tr><td class="px-3 py-2 text-gray-500">Total Credits (In)</td><td class="px-3 py-2 text-right font-mono font-semibold text-green-600">+ ${money(totalCredits)}</td></tr>
                <tr><td class="px-3 py-2 text-gray-500">Total Debits (Out)</td><td class="px-3 py-2 text-right font-mono font-semibold text-red-600">- ${money(totalDebits)}</td></tr>
                <tr class="border-t-2 border-gray-200 bg-primary-soft"><td class="px-3 py-2 font-bold">Closing Balance</td><td class="px-3 py-2 text-right font-mono font-bold text-primary">${money(bankAccount.currentBalance)}</td></tr>
              </tbody>
            </table>
          </div>

          <!-- RECONCILIATION SUMMARY -->
          <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
            <div class="px-4 py-2.5 border-b border-gray-100 bg-gray-50">
              <div class="text-sm font-bold text-gray-800">
                <i class="fa-solid fa-clipboard-check text-primary mr-1.5"></i>Reconciliation Summary
              </div>
            </div>
            <table class="w-full text-xs">
              <tbody>
                <tr><td class="px-3 py-2 text-gray-500">Total Bank Transactions</td><td class="px-3 py-2 text-right font-mono font-semibold">${bankTransactions.length}</td></tr>
                <tr><td class="px-3 py-2 text-gray-500">Reconciled</td><td class="px-3 py-2 text-right font-mono font-semibold text-green-600">${matched}</td></tr>
                <tr><td class="px-3 py-2 text-gray-500">Unreconciled</td><td class="px-3 py-2 text-right font-mono font-semibold text-amber-600">${unmatched}</td></tr>
                <tr><td class="px-3 py-2 text-gray-500">Reconciliation %</td><td class="px-3 py-2 text-right font-mono font-semibold text-primary">${bankTransactions.length > 0 ? Math.round(matched / bankTransactions.length * 100) : 0}%</td></tr>
              </tbody>
            </table>
          </div>

          <!-- MONTHLY SUMMARY -->
          <div class="bg-white border border-gray-200 rounded-xl overflow-hidden md:col-span-2">
            <div class="px-4 py-2.5 border-b border-gray-100 bg-gray-50">
              <div class="text-sm font-bold text-gray-800">
                <i class="fa-solid fa-calendar text-primary mr-1.5"></i>Monthly Summary
              </div>
            </div>
            <table class="w-full text-xs">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-3 py-2 text-left text-[9.5px] uppercase tracking-wide text-gray-500">Month</th>
                  <th class="px-3 py-2 text-center text-[9.5px] uppercase tracking-wide text-gray-500">Transactions</th>
                  <th class="px-3 py-2 text-right text-[9.5px] uppercase tracking-wide text-gray-500">Credits (In)</th>
                  <th class="px-3 py-2 text-right text-[9.5px] uppercase tracking-wide text-gray-500">Debits (Out)</th>
                  <th class="px-3 py-2 text-right text-[9.5px] uppercase tracking-wide text-gray-500">Net</th>
                </tr>
              </thead>
              <tbody>
                ${Object.keys(monthly).sort().map(function (k) {
                  var m = monthly[k];
                  var net = m.credits - m.debits;
                  return `
                    <tr class="border-b border-gray-100">
                      <td class="px-3 py-2 font-semibold">${k}</td>
                      <td class="px-3 py-2 text-center">${m.count}</td>
                      <td class="px-3 py-2 text-right font-mono text-green-600">${money(m.credits)}</td>
                      <td class="px-3 py-2 text-right font-mono text-red-600">${money(m.debits)}</td>
                      <td class="px-3 py-2 text-right font-mono font-bold ${net >= 0 ? 'text-green-600' : 'text-red-600'}">${money(net)}</td>
                    </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>`;

      document.getElementById('reportsPanel').innerHTML = html;
    }

    // =============================================================
    // IMPORT STATEMENT
    // =============================================================
    function openImportStatement() {
      var html = `
        ${modalHeader('Import Bank Statement', 'Upload CSV or Excel from your bank')}
        <div class="px-5 py-4">
          <div class="mb-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
            <div class="text-[10px] font-bold uppercase tracking-wide text-gray-500 mb-1">Importing into</div>
            <div class="text-sm font-semibold text-gray-800">${bankAccount.name}</div>
            <div class="text-[11px] text-gray-500">${bankAccount.bankName} · ${bankAccount.accountNumber}</div>
          </div>

          <div class="upload-area" onclick="document.getElementById('stmtFile').click()" id="uploadArea">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size:32px;color:#6da84c;"></i>
            <div class="text-sm font-semibold text-gray-700 mt-2">Click to upload statement</div>
            <div class="text-[11px] text-gray-500 mt-1">CSV, XLS or XLSX · Max 5MB</div>
            <input type="file" id="stmtFile" accept=".csv,.xls,.xlsx" class="hidden" onchange="handleStatementUpload(event)">
          </div>

          <div id="uploadPreview" class="mt-3"></div>

          <div class="mt-3 p-3 bg-primary-soft rounded-lg text-[11px] text-gray-600 border border-primary/20">
            <i class="fa-solid fa-circle-info text-primary mr-1"></i>
            <b>Expected columns:</b> Date, Description, Reference, Debit, Credit, Balance (in any order).
            The system will auto-detect column mappings.
          </div>
        </div>
        ${modalFooter('Import Transactions', 'onclick="processStatementImport()" id="importBtn" disabled')}
      `;
      openModal(html, { width: 'max-w-2xl' });
    }

    var uploadedStatementRows = [];

    function handleStatementUpload(event) {
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, { type: 'array' });
          var sheet = workbook.Sheets[workbook.SheetNames[0]];
          var json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
          uploadedStatementRows = json;
          renderUploadPreview(json);
        } catch (err) {
          showToast('Error reading file: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function renderUploadPreview(rows) {
      if (rows.length < 2) {
        document.getElementById('uploadPreview').innerHTML = '<div class="text-amber-600 text-xs">File appears empty or malformed</div>';
        return;
      }
      var headers = rows[0];
      var preview = rows.slice(1, 6);

      var html = `
        <div class="border border-gray-200 rounded-lg overflow-hidden">
          <div class="px-3 py-2 bg-green-50 border-b border-green-100 text-xs font-semibold text-green-800">
            <i class="fa-solid fa-check-circle mr-1"></i>File loaded — ${rows.length - 1} transaction(s) detected
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-[10.5px]">
              <thead class="bg-gray-50">
                <tr>${headers.map(function (h) { return '<th class="px-2 py-1.5 text-left text-[9px] uppercase tracking-wide text-gray-500">' + h + '</th>'; }).join('')}</tr>
              </thead>
              <tbody>
                ${preview.map(function (r) {
                  return '<tr class="border-b border-gray-100">' + r.map(function (c) { return '<td class="px-2 py-1.5">' + (c || '') + '</td>'; }).join('') + '</tr>';
                }).join('')}
              </tbody>
            </table>
          </div>
          ${rows.length > 6 ? '<div class="px-3 py-2 text-[10px] text-gray-500 bg-gray-50">… and ' + (rows.length - 6) + ' more rows</div>' : ''}
        </div>`;
      document.getElementById('uploadPreview').innerHTML = html;

      var btn = document.getElementById('importBtn');
      if (btn) btn.disabled = false;
    }

    function processStatementImport() {
      if (uploadedStatementRows.length < 2) {
        showToast('Please upload a statement file first', 'error');
        return;
      }
      var headers = uploadedStatementRows[0].map(function (h) { return String(h).toLowerCase().trim(); });
      var dateIdx = headers.findIndex(function (h) { return h.indexOf('date') !== -1; });
      var descIdx = headers.findIndex(function (h) { return h.indexOf('desc') !== -1 || h.indexOf('narration') !== -1 || h.indexOf('particular') !== -1; });
      var refIdx = headers.findIndex(function (h) { return h.indexOf('ref') !== -1 || h.indexOf('chq') !== -1 || h.indexOf('cheque') !== -1; });
      var debitIdx = headers.findIndex(function (h) { return h.indexOf('debit') !== -1 || h.indexOf('withdrawal') !== -1 || h.indexOf('dr') !== -1; });
      var creditIdx = headers.findIndex(function (h) { return h.indexOf('credit') !== -1 || h.indexOf('deposit') !== -1 || h.indexOf('cr') !== -1; });
      var balIdx = headers.findIndex(function (h) { return h.indexOf('balance') !== -1; });

      var imported = 0;
      for (var i = 1; i < uploadedStatementRows.length; i++) {
        var row = uploadedStatementRows[i];
        var dateVal = row[dateIdx];
        var descVal = row[descIdx];
        if (!dateVal || !descVal) continue;

        bankTransactions.push({
          id: 'BT-' + String(bankTransactions.length + 1).padStart(3, '0'),
          date: normalizeDate(dateVal),
          description: String(descVal),
          reference: refIdx >= 0 ? String(row[refIdx] || '') : '',
          debit: debitIdx >= 0 ? (parseFloat(row[debitIdx]) || 0) : 0,
          credit: creditIdx >= 0 ? (parseFloat(row[creditIdx]) || 0) : 0,
          balance: balIdx >= 0 ? (parseFloat(row[balIdx]) || 0) : 0,
          matched: false,
          matchedWith: null,
          matchType: null
        });
        imported++;
      }

      bankAccount.lastImportAt = new Date().toISOString().split('T')[0];

      closeModal();
      renderReconciliation();
      renderTransactions();
      renderStats();
      showToast('✓ Imported ' + imported + ' transaction(s)', 'success');
    }

    function normalizeDate(v) {
      if (typeof v === 'string') {
        var d = new Date(v);
        if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
      }
      if (typeof v === 'number') {
        var d2 = new Date((v - 25569) * 86400 * 1000);
        return d2.toISOString().split('T')[0];
      }
      return String(v);
    }

    // =============================================================
    // EDIT BANK DETAILS
    // =============================================================
    function openEditBankDetails() {
      var html = `
        ${modalHeader('Bank Account Details', 'Configure your company bank account')}
        <div class="px-5 py-4">
          <div class="grid grid-cols-2 gap-3">
            ${fld('Account Holder Name *', '<input type="text" class="form-input" id="bd_name" value="' + bankAccount.name + '">')}
            ${fld('Bank Name *', '<input type="text" class="form-input" id="bd_bank" value="' + bankAccount.bankName + '">')}
            ${fld('Account Number *', '<input type="text" class="form-input" id="bd_number" value="' + bankAccount.accountNumber + '">')}
            ${fld('IFSC Code *', '<input type="text" class="form-input" id="bd_ifsc" value="' + bankAccount.ifsc + '">')}
            ${fld('Branch', '<input type="text" class="form-input" id="bd_branch" value="' + bankAccount.branch + '">')}
            ${fld('Account Type', '<select class="form-input" id="bd_type"><option ' + (bankAccount.type === 'Current' ? 'selected' : '') + '>Current</option><option ' + (bankAccount.type === 'Savings' ? 'selected' : '') + '>Savings</option></select>')}
            ${fld('Opening Balance (₹)', '<input type="number" class="form-input" id="bd_opening" value="' + bankAccount.openingBalance + '" step="0.01">', 'As on start of accounting period')}
          </div>
        </div>
        ${modalFooter('Save Bank Details', 'onclick="saveBankDetails()"')}
      `;
      openModal(html, { width: 'max-w-2xl' });
    }

    function saveBankDetails() {
      bankAccount.name = document.getElementById('bd_name').value.trim();
      bankAccount.bankName = document.getElementById('bd_bank').value.trim();
      bankAccount.accountNumber = document.getElementById('bd_number').value.trim();
      bankAccount.ifsc = document.getElementById('bd_ifsc').value.trim().toUpperCase();
      bankAccount.branch = document.getElementById('bd_branch').value.trim();
      bankAccount.type = document.getElementById('bd_type').value;
      bankAccount.openingBalance = parseFloat(document.getElementById('bd_opening').value) || 0;

      closeModal();
      renderHeroBank();
      showToast('Bank details updated', 'success');
    }

    // =============================================================
    // TAB SWITCHING
    // =============================================================
    document.addEventListener('DOMContentLoaded', function () {
      var tabs = document.querySelectorAll('#bankingTabs .page-tab-btn');
      tabs.forEach(function (btn) {
        btn.addEventListener('click', function () {
          tabs.forEach(function (b) { b.classList.remove('active'); });
          this.classList.add('active');
          document.querySelectorAll('.page-tab-panel').forEach(function (p) { p.classList.remove('active'); });
          document.getElementById(this.dataset.tab).classList.add('active');
        });
      });
    });

    // =============================================================
    // INIT
    // =============================================================
    renderHeroBank();
    renderReconciliation();
    renderTransactions();
    renderRules();
    renderReports();
    renderStats();

    console.log('🏦 Single-Account Banking & Reconciliation Module Loaded');
    console.log('Transactions:', bankTransactions.length);

  </script>

</body>
</html>

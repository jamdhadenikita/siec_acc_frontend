<style>
  body { font-size: 12px; background: #f3f4f6; }

  .form-input {
    width: 100%; border: 1px solid #e5e7eb; border-radius: 6px;

    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa; color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.12);
    background: #ffffff;
  }
  .form-input:disabled { background: #f3f4f6; cursor: not-allowed; }

  .form-label {
    font-size: 10px; font-weight: 600; color: #374151;
    display: block; margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 9.5px; color: #9ca3af; margin-top: 2px; }

  .badge {

    padding: 2px 8px; border-radius: 12px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }

  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;

  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-card .stat-label {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: #6b7280;
  }
  .stat-card .stat-value {

    color: #1a1a2e; margin-top: 2px;
  }

  .btn-icon-action {
    transition: all 0.15s ease; width: 28px; height: 28px;

  .btn-icon-action.primary:hover { background: #eef5e8; color: #6da84c; }

  .toast { animation: fadeIn 0.2s ease; font-size: 12px; }

  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }

  .doc-icon-po { background: #dbeafe; color: #1e40af; }
  .doc-icon-bill { background: #fef3c7; color: #92400e; }
  .doc-icon-dc { background: #ede9fe; color: #5b21b6; }
  .doc-icon-pl { background: #fef3c7; color: #92400e; }
  .doc-icon-contract { background: #f1f5f9; color: #475569; }

  .doc-card .doc-meta {

  .doc-card .doc-tag {

  /* Folder card */
  .folder-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = { success: 'bg-green-600', info: 'bg-primary', warning: 'bg-amber-600', error: 'bg-red-600' };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // MODAL
    // =============================================================
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');

          <div>
            <h3 class="modal-title text-gray-900">${title}</h3>
            ${subtitle ? '<p class="modal-subtitle mt-0.5">' + subtitle + '</p>' : ''}

          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
          <div>${extraBtns || ''}</div>

            <button ${onSaveAttr} class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `<div class="mb-2"><label class="form-label">${label}</label>${inputHtml}${hint ? '<div class="form-hint">' + hint + '</div>' : ''}</div>`;

    var activeFolder = 'all';

    // =============================================================
    // FOLDER ICON & CLASS HELPERS
    // =============================================================

    function getDocIcon(type) {
      switch(type) {
        case 'Invoice': return iconInvoice();
        case 'Purchase Order': return iconCart();
        case 'Purchase Bill': return iconCartBig();
        case 'Delivery Challan': return iconTruck();
        case 'Packing List': return iconBox();
        case 'Goods Receipt': return iconDoc();
        case 'Contract': return iconFile();
        case 'Site Photo': return iconImage();
        case 'Vendor Payment': return iconMoney();
        case 'Customer Payment': return iconMoney();
        default: return iconDoc();
      }
    }

    function getDocIconClass(type) {
      switch(type) {
        case 'Invoice': return 'doc-icon-invoice';
        case 'Purchase Order': return 'doc-icon-po';
        case 'Purchase Bill': return 'doc-icon-bill';
        case 'Delivery Challan': return 'doc-icon-dc';
        case 'Packing List': return 'doc-icon-pl';
        case 'Contract': return 'doc-icon-contract';
        case 'Site Photo': return 'doc-icon-image';
        case 'Goods Receipt': return 'doc-icon-other';
        case 'Vendor Payment': return 'doc-icon-payment';
        case 'Customer Payment': return 'doc-icon-payment';
        default: return 'doc-icon-other';
      }
    }

    // =============================================================
    // RENDER STATS
    // =============================================================

    function renderStats() {
      var total = documents.length;
      var auto = documents.filter(function(d) { return d.source === 'auto'; }).length;
      var manual = documents.filter(function(d) { return d.source === 'manual'; }).length;
      var storage = documents.reduce(function(s, d) { return s + d.size; }, 0);
      var projTagged = new Set(documents.map(function(d) { return d.projectId; })).size;

      document.getElementById('totalDocs').textContent = total;
      document.getElementById('autoLinked').textContent = auto;
      document.getElementById('manualUploads').textContent = manual;
      document.getElementById('totalStorage').textContent = formatSize(storage);
      document.getElementById('projectsTagged').textContent = projTagged;
    }

    // =============================================================
    // RENDER FOLDERS
    // =============================================================

    function renderFolders() {
      folders.forEach(function(f) {
        if (f.id === 'all') {
          f.count = documents.length;
        } else {
          f.count = documents.filter(function(d) { return d.projectId === f.id; }).length;
        }
      });

      var html = folders.map(function(f) {
        return `
          <div class="folder-card ${f.id === activeFolder ? 'active' : ''}" onclick="selectFolder('${f.id}')">
            <div class="folder-icon" style="background:${f.id === 'all' ? '#eef5e8' : f.color + '15'}; color:${f.id === 'all' ? '#6da84c' : f.color};">
              ${iconFolder()}
            </div>
            <div class="flex-1 min-w-0">
              <div class="folder-name truncate">${f.name}</div>
              <div class="folder-meta">${f.count} document${f.count !== 1 ? 's' : ''}</div>
            </div>
          </div>`;
      }).join('');

      document.getElementById('foldersList').innerHTML = html;

      var filterProject = document.getElementById('filterProject');
      var currentVal = filterProject.value;
      filterProject.innerHTML = '<option value="all">All Projects</option>';
      projects.forEach(function(p) {
        if (p.id !== 'all') filterProject.innerHTML += '<option value="' + p.id + '">' + p.name + '</option>';
      });
      filterProject.value = currentVal;
    }

    function selectFolder(id) {
      activeFolder = id;
      var f = folders.find(function(x) { return x.id === id; });
      document.getElementById('currentFolderTitle').textContent = f ? f.name : 'All Documents';
      renderFolders();
      renderDocuments();
    }

    // =============================================================
    // RENDER DOCUMENTS GRID
    // =============================================================

    function getFilteredDocuments() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.toLowerCase() : '';
      var projectFilter = document.getElementById('filterProject').value || 'all';
      var sourceFilter = document.getElementById('filterSource').value || 'all';
      var sortBy = document.getElementById('sortBy').value || 'date-desc';

      var filtered = documents.filter(function(d) {
        var matchFolder = activeFolder === 'all' || d.projectId === activeFolder;
        var matchSearch = d.name.toLowerCase().indexOf(q) !== -1 ||
          d.description.toLowerCase().indexOf(q) !== -1 ||
          d.type.toLowerCase().indexOf(q) !== -1;
        var matchProject = projectFilter === 'all' || d.projectId === projectFilter;
        var matchSource = sourceFilter === 'all' || d.source === sourceFilter;
        return matchFolder && matchSearch && matchProject && matchSource;
      });

      // Sort
      filtered.sort(function(a, b) {
        if (sortBy === 'date-desc') return b.date.localeCompare(a.date);
        if (sortBy === 'date-asc') return a.date.localeCompare(b.date);
        if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
        if (sortBy === 'name-desc') return b.name.localeCompare(a.name);
        return 0;
      });

      return filtered;
    }

    function renderDocuments() {
      var filtered = getFilteredDocuments();

      document.getElementById('docCount').textContent = filtered.length;

      if (filtered.length === 0) {
        document.getElementById('documentsGrid').innerHTML = `
          <div class="preview-area">
            <div class="flex justify-center mb-2 empty-icon-svg">${iconFolder()}</div>
            <div class="font-semibold mb-1">No documents found</div>
            <div class="text-[11px]">Try changing filters or upload a new document.</div>
          </div>`;
        return;
      }

      var html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">';
      filtered.forEach(function(d) {
        html += `
          <div class="doc-card" onclick="viewDocument('${d.id}')">
            <div class="doc-icon-box ${getDocIconClass(d.type)}">
              ${getDocIcon(d.type)}
            </div>
            <div class="flex-1 min-w-0">
              <div class="doc-name truncate">${d.name}</div>
              <div class="doc-meta">
                <div>${d.description}</div>
                <div class="mt-1">${formatDate(d.date)} · ${formatSize(d.size)} · ${d.uploadedBy}</div>
                <div class="mt-1">
                  <span class="doc-tag">${d.type}</span>
                  <span class="doc-tag" style="background:${d.source === 'auto' ? '#dcfce7' : '#dbeafe'}; color:${d.source === 'auto' ? '#166534' : '#1e40af'};">${d.source === 'auto' ? 'Auto-Linked' : 'Manual'}</span>
                </div>
              </div>
            </div>
            <div class="flex flex-col gap-1">
              <button onclick="event.stopPropagation(); downloadDocument('${d.id}')" class="btn-icon-action primary" title="Download">${iconDownload()}</button>
              <button onclick="event.stopPropagation(); deleteDocument('${d.id}')" class="btn-icon-action danger" title="Delete">${iconTrash()}</button>
            </div>
          </div>`;
      });
      html += '</div>';

      document.getElementById('documentsGrid').innerHTML = html;

      renderStats();
      renderFolders();
    }

    // =============================================================
    // VIEW / DOWNLOAD / DELETE
    // =============================================================

    function viewDocument(id) {
      var d = documents.find(function(x) { return x.id === id; });
      if (!d) return;

      var modalContent = `
        ${modalHeader(d.name, d.type + ' · ' + d.projectName)}
        <div class="px-5 py-4">
          <div class="grid grid-cols-2 gap-3 text-sm mb-4">
            <div><span class="text-gray-500">Type</span><br><span class="font-semibold">${d.type}</span></div>
            <div><span class="text-gray-500">Project</span><br><span class="font-semibold">${d.projectName}</span></div>
            <div><span class="text-gray-500">Date</span><br><span class="font-semibold">${formatDate(d.date)}</span></div>
            <div><span class="text-gray-500">Size</span><br><span class="font-semibold">${formatSize(d.size)}</span></div>
            <div><span class="text-gray-500">Source</span><br><span class="font-semibold">${d.source === 'auto' ? 'Auto-Linked' : 'Manual Upload'}</span></div>
            <div><span class="text-gray-500">Uploaded By</span><br><span class="font-semibold">${d.uploadedBy}</span></div>
            <div class="col-span-2"><span class="text-gray-500">Description</span><br><span class="font-semibold">${d.description}</span></div>
          </div>

          <div class="preview-area">
            <div class="flex justify-center mb-2 empty-icon-svg">${getDocIcon(d.type)}</div>
            <div class="font-semibold mb-1">Document Preview</div>
            <div class="text-[11px]">Preview not available in this demo. Use download to view.</div>
          </div>
        </div>
        ${modalFooter('Close', 'onclick="closeModal()"', `
          <button onclick="downloadDocument('${d.id}')" class="text-xs font-semibold text-primary hover:underline flex items-center gap-1 px-2 py-1 rounded border border-primary/20 hover:bg-primary-light transition">
            ${iconDownload()} Download
          </button>
        `)}
      `;
      openModal(modalContent, { width: 'max-w-2xl' });
    }

    function downloadDocument(id) {
      var d = documents.find(function(x) { return x.id === id; });
      if (!d) return;
      showToast('Downloading ' + d.name + '...', 'info');
      setTimeout(function() { showToast('Downloaded successfully!', 'success'); }, 800);
    }

    function deleteDocument(id) {
      var d = documents.find(function(x) { return x.id === id; });
      if (!d) return;

      var modalContent = `
        ${modalHeader('Delete Document', d.name)}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Delete <b>${d.name}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone.</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteDocument(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteDocument(id) {
      documents = documents.filter(function(x) { return x.id !== id; });
      closeModal();
      renderDocuments();
      showToast('Document deleted', 'warning');
    }

    // =============================================================
    // UPLOAD DOCUMENT
    // =============================================================

    function openUploadDoc() {
      var projectOptions = projects.filter(function(p) { return p.id !== 'all'; }).map(function(p) {
        return '<option value="' + p.id + '">' + p.name + '</option>';
      }).join('');

      var modalContent = `
        ${modalHeader('Upload Document', 'Add a manual document to the repository')}
        <div class="px-5 py-4">
          <div class="grid grid-cols-2 gap-3">
            ${fld('Document Type *', '<select class="form-input" id="u_type"><option>Contract</option><option>Site Photo</option><option>Other</option><option>Legal</option><option>Proposal</option><option>Compliance</option></select>')}
            ${fld('Project *', '<select class="form-input" id="u_project">' + projectOptions + '</select>')}
          </div>
          ${fld('Document Name *', '<input type="text" class="form-input" id="u_name" placeholder="e.g. Contract_2026.pdf">')}
          ${fld('Description', '<textarea rows="2" class="form-input" id="u_desc" placeholder="Short description"></textarea>')}
          ${fld('File *', '<input type="file" class="form-input" id="u_file" accept="*/*">', 'Max file size: 10 MB')}
        </div>
        ${modalFooter('Upload', 'onclick="saveUploadedDocument()"')}
      `;
      openModal(modalContent, { width: 'max-w-lg' });
    }

    function saveUploadedDocument() {
      var type = document.getElementById('u_type').value;
      var projectId = document.getElementById('u_project').value;
      var name = document.getElementById('u_name').value.trim();
      var desc = document.getElementById('u_desc').value.trim();
      var fileInput = document.getElementById('u_file');

      if (!name) { showToast('Document name is required', 'error'); return; }

      var proj = projects.find(function(p) { return p.id === projectId; });
      var fileSize = 200;
      if (fileInput.files && fileInput.files[0]) {
        fileSize = Math.round(fileInput.files[0].size / 1024);
      }

      var newDoc = {
        id: 'DOC-' + String(nextDocNo++).padStart(3, '0'),
        name: name,
        type: type,
        projectId: projectId,
        projectName: proj ? proj.name : '',
        date: new Date().toISOString().split('T')[0],
        size: fileSize,
        source: 'manual',
        uploadedBy: 'Admin',
        description: desc || type + ' document'
      };
      documents.unshift(newDoc);
      closeModal();
      renderDocuments();
      showToast('Document uploaded successfully', 'success');
    }

      showToast('Exporting document list...', 'info');

      document.getElementById('filterProject').value = 'all';

      renderDocuments();
      toggleFilterDD();

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');

        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">

          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

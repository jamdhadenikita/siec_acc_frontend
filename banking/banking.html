<style>
  body {
    font-size: 12px;
    background: #f3f4f6;
  }

  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.12);
    background: #ffffff;
  }
  .form-input:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
  }

  .form-label {
    font-size: 10px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 9.5px; color: #9ca3af; margin-top: 2px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }
  .badge-dot-purple { background: #8b5cf6; }

  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    padding: 10px 14px !important;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-card .stat-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
  }
  .stat-card .stat-value {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
    margin-top: 2px;
  }

  .table-row-hover:hover {
    background: #f8fafc;
  }

  .btn-icon-action {
    transition: all 0.15s ease;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }
  .btn-icon-action.primary:hover {
    background: #eef5e8;
    color: #6da84c;
  }

  .toast {
    animation: fadeIn 0.2s ease;
    font-size: 12px;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  .modal-scroll {
    max-height: 55vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .modal-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }

  .empty-icon-svg {
    opacity: 0.2;
    width: 40px;
    height: 40px;
    color: #94a3b8;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .page-subtitle {
    font-size: 12px;
    color: #6b7280;
  }
  .page-breadcrumb {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6da84c;
  }

  table th {
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
    padding: 8px 12px;
  }
  table td {
    font-size: 12px;
    padding: 8px 12px;
  }
  table td .font-mono {
    font-size: 11px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
  }
  .modal-subtitle {
    font-size: 11px;
    color: #6b7280;
  }

  .filter-btn {
    font-size: 11px;
    padding: 5px 12px;
  }
  .filter-btn svg {
    width: 14px;
    height: 14px;
  }

  /* Bank Account Card */
  .bank-account-card {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px 16px;
    background: #ffffff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .bank-account-card:hover {
    border-color: #6da84c;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  .bank-account-card .bank-name {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a2e;
  }
  .bank-account-card .bank-balance {
    font-size: 18px;
    font-weight: 700;
    color: #6da84c;
  }
  .bank-account-card .bank-details {
    font-size: 10px;
    color: #6b7280;
  }

  /* Reconciliation */
  .recon-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
    margin-bottom: 4px;
    transition: background 0.15s;
  }
  .recon-item:hover {
    background: #f8fafc;
  }
  .recon-item.matched {
    border-color: #22c55e;
    background: #f0fdf4;
  }
  .recon-item.unmatched {
    border-color: #ef4444;
    background: #fef2f2;
  }
</style>
</head>

    <div id="sidebar-root"></div>

    <div class="app-main flex-1 flex flex-col min-w-0">

        <div class="max-w-7xl mx-auto">

          <div class="flex flex-wrap items-start justify-between gap-3 mb-4">

              <div class="page-breadcrumb">Finance</div>

            <div class="flex gap-2 flex-wrap">

                Add Account

              <button onclick="openAddTransaction()" class="inline-flex items-center gap-1.5 bg-secondary hover:bg-secondary-dark text-white text-[11px] font-semibold px-3 py-2 rounded-lg transition shadow-sm">

                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>

            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">

          <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">

                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>

            <div class="p-5">

        </div>

    </div>
  </div>

  <script src="/assets/js/nav-sidebar.js"></script>
  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "banking",
      pageTitle: "Banking",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // SVG ICONS
    // =============================================================
    function iconPlus() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>`;
    }
    function iconEdit() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
    }
    function iconEye() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function iconX() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconFilter() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>`;
    }
    function iconSave() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`;
    }
    function iconInfo() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>`;
    }
    function iconDocument() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
    }
    function iconBank() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V10M10 21V10M14 21V10M19 21V10"/><path d="M2 10l10-6 10 6"/></svg>`;
    }
    function iconTransfer() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16l-4-4 4-4"/><path d="M21 12h-12"/></svg>`;
    }
    function iconReconcile() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`;
    }

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // MODAL
    // =============================================================
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="modal-title text-gray-900">${title}</h3>
            ${subtitle ? '<p class="modal-subtitle mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-2">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // =============================================================
    // PAGE TABS
    // =============================================================
    document.addEventListener('DOMContentLoaded', function() {
      var tabs = document.querySelectorAll('#bankTabs .page-tab-btn');
      tabs.forEach(function(btn) {
        btn.addEventListener('click', function() {
          tabs.forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          var panels = document.querySelectorAll('.page-tab-panel');
          panels.forEach(function(p) { p.classList.remove('active'); });
          document.getElementById(this.dataset.tab).classList.add('active');
        });
      });
    });

    // =============================================================
    // HELPERS
    // =============================================================
    function money(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

    function statusBadge(status) {
      var map = {
        active: 'badge-green',
        inactive: 'badge-gray',
        pending: 'badge-amber',
        reconciled: 'badge-blue',
        matched: 'badge-green',
        unmatched: 'badge-red'
      };
      var dot = {
        active: 'badge-dot-green',
        inactive: 'badge-dot-gray',
        pending: 'badge-dot-amber',
        reconciled: 'badge-dot-blue',
        matched: 'badge-dot-green',
        unmatched: 'badge-dot-red'
      };
      var label = status.charAt(0).toUpperCase() + status.slice(1);
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';
    }

    function transactionTypeBadge(type) {
      var map = {
        deposit: 'badge-green',
        withdrawal: 'badge-red',
        transfer: 'badge-blue'
      };
      var dot = {
        deposit: 'badge-dot-green',
        withdrawal: 'badge-dot-red',
        transfer: 'badge-dot-blue'
      };
      var label = type.charAt(0).toUpperCase() + type.slice(1);
      return '<span class="badge ' + map[type] + '"><span class="badge-dot ' + dot[type] + '"></span>' + label + '</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) {
        html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';

    function saveTransaction(existingId) {
      var date = document.getElementById('tx_date').value;
      var accountId = document.getElementById('tx_account').value;
      var type = document.getElementById('tx_type').value;
      var amount = parseFloat(document.getElementById('tx_amount').value) || 0;
      var description = document.getElementById('tx_description').value.trim();
      var reference = document.getElementById('tx_reference').value.trim() || '';
      var status = document.getElementById('tx_status').value;

      if (!date || !accountId || amount <= 0 || !description) {
        showToast('Please fill all required fields (Date, Account, Amount, Description)', 'error');
        return;
      }

      if (existingId) {
        var t = transactions.find(function(x) { return x.id === existingId; });
        if (t) {
          // Revert old balance
          var oldAccount = bankAccounts.find(function(a) { return a.id === t.accountId; });
          if (oldAccount) {
            if (t.type === 'deposit') oldAccount.balance -= t.amount;
            else if (t.type === 'withdrawal' || t.type === 'transfer') oldAccount.balance += t.amount;
          }

          t.date = date;
          t.accountId = accountId;
          t.type = type;
          t.amount = amount;
          t.description = description;
          t.reference = reference;
          t.status = status;

          // Apply new balance
          var newAccount = bankAccounts.find(function(a) { return a.id === accountId; });
          if (newAccount) {
            if (type === 'deposit') newAccount.balance += amount;
            else if (type === 'withdrawal' || type === 'transfer') newAccount.balance -= amount;
          }
          showToast('Transaction updated successfully', 'success');
        }
      } else {
        var newTransaction = {
          id: 'TXN-' + String(nextTxnNo++).padStart(3, '0'),
          date: date,
          accountId: accountId,
          type: type,
          amount: amount,
          description: description,
          reference: reference,
          status: status,
          createdAt: date
        };
        transactions.unshift(newTransaction);

        // Update account balance
        var account = bankAccounts.find(function(a) { return a.id === accountId; });
        if (account) {
          if (type === 'deposit') account.balance += amount;
          else if (type === 'withdrawal' || type === 'transfer') account.balance -= amount;
        }
        showToast('Transaction created successfully', 'success');
      }

      closeModal();
      renderAccounts();
      renderTransactions();
      renderReconciliation();
    }

    function deleteTransaction(id) {
      if (confirm('Are you sure you want to delete this transaction?')) {
        var t = transactions.find(function(x) { return x.id === id; });
        if (t) {
          // Revert balance
          var account = bankAccounts.find(function(a) { return a.id === t.accountId; });
          if (account) {
            if (t.type === 'deposit') account.balance -= t.amount;
            else if (t.type === 'withdrawal' || t.type === 'transfer') account.balance += t.amount;
          }
          transactions = transactions.filter(function(x) { return x.id !== id; });
          renderAccounts();
          renderTransactions();
          renderReconciliation();
          showToast('Transaction deleted', 'warning');
        }
      }
    }

    function reconcileTransaction(id) {
      var t = transactions.find(function(x) { return x.id === id; });
      if (t) {
        t.status = 'reconciled';
        renderReconciliation();
        renderTransactions();
        showToast('Transaction ' + t.id + ' reconciled!', 'success');
      }

    function reconcileAll() {
      var pending = transactions.filter(function(t) { return t.status !== 'reconciled'; });
      if (pending.length === 0) {
        showToast('All transactions are already reconciled!', 'info');
        return;
      }
      pending.forEach(function(t) { t.status = 'reconciled'; });
      renderReconciliation();
      renderTransactions();
      showToast(pending.length + ' transactions reconciled!', 'success');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search transactions by description, reference…"
              onkeyup="filterBanking()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    function filterBanking() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var rows = document.querySelectorAll('#tbody-anchor tr');
      rows.forEach(function(row) {
        var text = row.textContent.toLowerCase();
        row.style.display = text.indexOf(q) !== -1 ? '' : 'none';
      });
    }

    // =============================================================
    // INIT
    // =============================================================

    renderAccounts();
    renderTransactions();
    renderReconciliation();

    console.log('💰 Banking Module Loaded Successfully');
    console.log('📊 Total Accounts:', bankAccounts.length);
    console.log('💳 Total Balance:', money(bankAccounts.reduce(function(sum, a) { return sum + a.balance; }, 0)));
    console.log('📝 Total Transactions:', transactions.length);

  </script>

</body>

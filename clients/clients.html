<!-- ANTI-FLICKER SCRIPT -->
<script>
  (function () {
    try {
      var collapsed = localStorage.getItem("sidebarCollapsed") === "true";
      document.documentElement.classList.add(collapsed ? "sidebar-collapsed" : "sidebar-expanded");
    } catch (e) {
      document.documentElement.classList.add("sidebar-expanded");
    }
  })();
</script>

<!-- Page-specific styles -->
<style>
  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
    background: #ffffff;
  }
  .form-input:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
  }
  .form-label {
    font-size: 11.5px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 4px;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 10.5px; color: #9ca3af; margin-top: 3px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }
  .badge-dot-purple { background: #8b5cf6; }

  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }

  .table-row-hover:hover {
    background: #f8fafc;
  }

  .modal-tab-btn {
    transition: all 0.2s ease;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    color: #6b7280;
    cursor: pointer;
    background: transparent;
  }
  .modal-tab-btn.active {
    color: #6da84c;
    border-bottom-color: #6da84c;
  }
  .modal-tab-btn:hover:not(.active) {
    color: #1f2937;
    border-bottom-color: #d1d5db;
  }
  .modal-tab-panel { display: none; }
  .modal-tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  .btn-icon-action {
    transition: all 0.15s ease;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }

  .toast {
    animation: fadeIn 0.2s ease;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  .modal-scroll {
    max-height: 60vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .modal-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }

  .empty-icon-svg {
    opacity: 0.2;
    width: 48px;
    height: 48px;
    color: #94a3b8;
  }

  .customer-avatar {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
  }
</style>
</head>

<body class="bg-gray-50 text-gray-800 antialiased">

  <div class="flex min-h-screen">
    <!-- Sidebar gets injected here by nav-sidebar.js -->
    <div id="sidebar-root"></div>

    <div class="app-main flex-1 flex flex-col min-w-0">
      <!-- Top bar gets injected here -->
      <div id="topbar-root"></div>

      <!-- ========================================================== -->
      <!-- ============= PAGE CONTENT STARTS HERE ==================== -->
      <!-- ========================================================== -->
      <main class="p-4 sm:p-6 lg:p-8">

        <!-- Toast Container -->
        <div id="toastWrap" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 items-end"></div>

        <!-- Modal Root -->

        <div class="max-w-7xl mx-auto">

          <!-- Page Header -->
          <div class="flex flex-wrap items-start justify-between gap-4 mb-6">
            <div>
              <div class="text-[11px] font-semibold tracking-wide uppercase text-primary">Masters</div>
              <h1 class="text-[24px] sm:text-[28px] font-bold tracking-tight text-gray-900">Clients / Customers</h1>
              <p class="text-[13px] text-gray-500 mt-1">Customer master with GST details, addresses, credit limits, transactions and statements.</p>
            </div>
            <div class="flex gap-2.5 flex-wrap">
              <!-- Filter Button -->
              <div class="relative inline-block" data-dd-trigger>
                <button onclick="toggleFilterDD()" class="inline-flex items-center gap-2 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 text-[13px] font-semibold px-4 py-2.5 rounded-lg transition">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M7 12h10M11 18h2"/>
                  </svg>
                  Filter
                  <span id="filterBadge" class="hidden text-[10px] bg-primary text-white px-1.5 py-0.5 rounded-full">0</span>
                </button>
                <div id="filterDD" data-dd-menu class="hidden absolute top-full left-0 mt-2 w-60 bg-white border border-gray-200 rounded-xl shadow-lg p-3 z-50">
                  <div class="mb-3">
                    <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Status</label>
                    <select id="filterStatus" onchange="filterCustomers()" class="form-input text-[12px]">
                      <option value="all">All Status</option>
                      <option value="active">Active</option>
                      <option value="inactive">Inactive</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">GST Registered</label>
                    <select id="filterGST" onchange="filterCustomers()" class="form-input text-[12px]">
                      <option value="all">All</option>
                      <option value="yes">Registered</option>
                      <option value="no">Unregistered</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Customer Type</label>
                    <select id="filterType" onchange="filterCustomers()" class="form-input text-[12px]">
                      <option value="all">All Types</option>
                      <option value="business">Business</option>
                      <option value="individual">Individual</option>
                      <option value="government">Government</option>
                    </select>
                  </div>
                  <button onclick="clearFilters()" class="text-[12px] text-primary font-semibold hover:underline">Clear Filters</button>
                </div>
              </div>

              <!-- Add Customer Button -->
              <button onclick="openAddCustomer()" class="inline-flex items-center gap-2 bg-primary hover:bg-primary-dark text-white text-[13px] font-semibold px-4 py-2.5 rounded-lg transition shadow-sm">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                Add Client
              </button>
            </div>
          </div>

          <!-- Stats Cards -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3.5 mb-6">
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 stat-card">
              <div class="text-[10.5px] font-semibold uppercase tracking-wider text-gray-500">Total Clients</div>
              <div class="text-[22px] font-bold text-gray-900" id="totalCustomers">0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 stat-card">
              <div class="text-[10.5px] font-semibold uppercase tracking-wider text-gray-500">Active</div>
              <div class="text-[22px] font-bold text-green-600" id="activeCustomers">0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 stat-card">
              <div class="text-[10.5px] font-semibold uppercase tracking-wider text-gray-500">GST Registered</div>
              <div class="text-[22px] font-bold text-blue-600" id="gstCustomers">0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 stat-card">
              <div class="text-[10.5px] font-semibold uppercase tracking-wider text-gray-500">Total Receivable</div>
              <div class="text-[22px] font-bold text-amber-600" id="totalReceivable">₹0</div>

          <!-- Customers Table Panel -->

  <!-- Shell JS -->

  <!-- Main Customers JS (all logic) -->
  <script>
    // =============================================================
    // NAV-SIDEBAR INIT — activePage: "clients"
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "clients",
      pageTitle: "Clients / Customers",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // CUSTOMERS MODULE — Complete Logic (No Emojis, Only SVG Icons)
    // =============================================================

    // ---------- SVG Icons ----------
    function iconPlus() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>`;
    }
    function iconEdit() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
    }
    function iconEye() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function iconX() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconFilter() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>`;
    }
    function iconSave() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`;
    }
    function iconInfo() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>`;
    }
    function iconUser() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    }
    function iconBuilding() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V10M10 21V10M14 21V10M19 21V10"/><path d="M2 10l10-6 10 6"/></svg>`;
    }
    function iconGST() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
    }
    function iconPhone() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>`;
    }
    function iconMail() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>`;
    }
    function iconChevronDown() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>`;
    }
    function iconLocation() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
    }
    function iconCredit() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>`;
    }

    // ---------- Toast System ----------
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // ---------- Modal System ----------
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full ${opts.width || 'max-w-3xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-6 py-5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="text-lg font-bold text-gray-900">${title}</h3>
            ${subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-3">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // ---------- Dropdown ----------
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      }
    });

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

    // ---------- Helpers ----------
    function money(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

    function badge(text, color) {
      var map = { green: 'badge-green', amber: 'badge-amber', red: 'badge-red', gray: 'badge-gray', blue: 'badge-blue', purple: 'badge-purple' };
      var dot = { green: 'badge-dot-green', amber: 'badge-dot-amber', red: 'badge-dot-red', gray: 'badge-dot-gray', blue: 'badge-dot-blue', purple: 'badge-dot-purple' };
      return '<span class="badge ' + map[color] + '"><span class="badge-dot ' + dot[color] + '"></span>' + text + '</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) {
        html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';
      }
      html += '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>';
      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';
      html += '</div>';
      return html;
    }

    function panelWrap(titleHtml, bodyHtml, extraHead) {
      return `
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
          <div class="flex items-center justify-between gap-3 flex-wrap px-5 py-4 border-b border-gray-100">
            <div class="font-bold text-[14.5px] text-gray-800 flex items-center gap-2">${titleHtml}</div>
            ${extraHead || ''}
          </div>
          <div>${bodyHtml}</div>
        </div>`;
    }

    function tableHtml(cols, rowsHtml) {
      var colHeaders = cols.map(function(c) {
        return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-gray-500 px-4 py-3 whitespace-nowrap">' + c + '</th>';
      }).join('');
      return `
        <div class="overflow-x-auto">
          <table class="w-full text-[13px]">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-200">${colHeaders}</tr>
            </thead>
            <tbody id="tbody-anchor">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    // =============================================================

    function getInitials(name) {
      if (!name) return 'C';
      var parts = name.split(' ');
      if (parts.length === 1) return name.substring(0, 2).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function renderStats() {
      document.getElementById('totalCustomers').textContent = customers.length;
      var active = customers.filter(function(c) { return c.status === 'active'; });
      document.getElementById('activeCustomers').textContent = active.length;
      var gst = customers.filter(function(c) { return c.gstRegistered; });
      document.getElementById('gstCustomers').textContent = gst.length;
      var total = customers.reduce(function(sum, c) { return sum + c.receivable; }, 0);
      document.getElementById('totalReceivable').textContent = money(total);
    }

    function getFilteredCustomers() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.toLowerCase() : '';
      var status = document.getElementById('filterStatus').value || 'all';
      var gst = document.getElementById('filterGST').value || 'all';
      var type = document.getElementById('filterType').value || 'all';

      return customers.filter(function(c) {
        var matchSearch = c.name.toLowerCase().indexOf(q) !== -1 ||
          c.companyName.toLowerCase().indexOf(q) !== -1 ||
          c.id.toLowerCase().indexOf(q) !== -1 ||
          c.phone.indexOf(q) !== -1 ||
          c.email.toLowerCase().indexOf(q) !== -1;
        var matchStatus = status === 'all' || c.status === status;
        var matchGST = gst === 'all' || (gst === 'yes' ? c.gstRegistered : !c.gstRegistered);
        var matchType = type === 'all' || c.customerType === type;
        return matchSearch && matchStatus && matchGST && matchType;
      });
    }

    function renderCustomers() {
      var filtered = getFilteredCustomers();

      var rowsHtml = '';
      if (filtered.length === 0) {
        rowsHtml = `

      var paymentTerms = document.getElementById('f_paymentTerms') ? document.getElementById('f_paymentTerms').value : 'Net 15 days';
      var creditLimit = document.getElementById('f_creditLimit') ? parseFloat(document.getElementById('f_creditLimit').value) || 0 : 0;
      var gstRegRadio = document.querySelector('input[name="gstReg"]:checked');
      var gstRegistered = gstRegRadio ? gstRegRadio.value === 'true' : false;
      var statusRadio = document.querySelector('input[name="customerStatus"]:checked');
      var status = statusRadio ? statusRadio.value : 'active';

      if (!name || !email || !phone) {
        showToast('Please fill all required fields (Name, Email, Phone)', 'error');
        return;
      }

      var color = customerColors[Math.floor(Math.random() * customerColors.length)];

      if (existingId) {
        var c = customers.find(function(x) { return x.id === existingId; });
        if (c) {
          c.name = name;
          c.companyName = companyName;
          c.customerType = customerType;
          c.email = email;
          c.phone = phone;
          c.billingAddress = billingAddress;
          c.shippingAddress = shippingAddress || billingAddress;
          c.city = city;
          c.state = state;
          c.stateCode = stateCode;
          c.pincode = pincode;
          c.gstin = gstin;
          c.pan = pan;
          c.paymentTerms = paymentTerms;
          c.creditLimit = creditLimit;
          c.gstRegistered = gstRegistered;
          c.status = status;
          showToast('Client updated successfully', 'success');
        }
      } else {
        var newCustomer = {
          id: 'CUS-' + String(nextCustomerNo++).padStart(3, '0'),
          name: name,
          companyName: companyName,
          customerType: customerType,
          email: email,
          phone: phone,
          billingAddress: billingAddress,
          shippingAddress: shippingAddress || billingAddress,
          city: city,
          state: state,
          stateCode: stateCode,
          pincode: pincode,
          gstin: gstin,
          pan: pan,
          paymentTerms: paymentTerms,
          creditLimit: creditLimit,
          gstRegistered: gstRegistered,
          status: status,
          receivable: 0,
          createdAt: new Date().toISOString().split('T')[0],
          color: color
        };
        customers.unshift(newCustomer);
        showToast('Client added successfully', 'success');
      }

      closeModal();
      renderCustomers();
    }

    function delCustomer(id) {
      var c = customers.find(function(x) { return x.id === id; });
      if (!c) return;

      var modalContent = `
        ${modalHeader('Delete Client', c.name)}
        <div class="px-6 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${c.name}</b>?</p>
          <p class="text-gray-400 text-[12px] mt-1">This action cannot be undone. All associated transactions will be affected.</p>
          ${c.receivable > 0 ? '<p class="text-amber-600 text-[12px] mt-2">⚠️ This client has outstanding receivable of ' + money(c.receivable) + '</p>' : ''}
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteCustomer(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteCustomer(id) {
      customers = customers.filter(function(x) { return x.id !== id; });
      closeModal();
      renderCustomers();
      showToast('Client deleted successfully', 'warning');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search clients by name, company, phone…"
              onkeyup="filterCustomers()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    renderCustomers();

    console.log('👥 Clients Module Loaded Successfully');
    console.log('📊 Total Clients:', customers.length);
    console.log('✅ Active Clients:', customers.filter(function(c) { return c.status === 'active'; }).length);
    console.log('💰 Total Receivable:', customers.reduce(function(sum, c) { return sum + c.receivable; }, 0));

  </script>

</body>
</html>

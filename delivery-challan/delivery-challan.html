    function paginateList(list, state) {
      var totalItems = list.length;
      var totalPages = Math.max(1, Math.ceil(totalItems / state.pageSize));
      if (state.page > totalPages) state.page = totalPages;
      if (state.page < 1) state.page = 1;
      var start = (state.page - 1) * state.pageSize;
      return { pageItems: list.slice(start, start + state.pageSize), totalItems: totalItems, totalPages: totalPages };
    }

    function paginationBarHtml(totalItems, state) {
      var totalPages = Math.max(1, Math.ceil(totalItems / state.pageSize));
      var start = totalItems === 0 ? 0 : (state.page - 1) * state.pageSize + 1;
      var end = Math.min(totalItems, state.page * state.pageSize);
      return `
        <div class="pagination-bar">
          <div class="pagination-info">Showing ${start}–${end} of ${totalItems}</div>
          <div class="pagination-controls">
            <select class="pagination-size-select" onchange="changeDCPageSize(this.value)">
              <option value="10" ${state.pageSize === 10 ? 'selected' : ''}>10</option>
              <option value="25" ${state.pageSize === 25 ? 'selected' : ''}>25</option>

            ${hasPL ? transportDetailsBlockHtml(dc.packingList) : ''}

            ${dc.notes ? `<div class="text-xs text-gray-500 mt-2"><strong>Notes:</strong> ${dc.notes}</div>` : ''}

            <div class="dc-footer">
              <p>This is a system generated delivery challan. | ${company.name}</p>
            </div>
          </div>

        </div>
        ${modalFooter('Close', 'onclick="closeModal()"', `
          <div class="flex gap-1.5">
            <button onclick="generatePackingList('${dc.id}')" class="text-xs font-semibold text-primary hover:underline flex items-center gap-1 px-2 py-1 rounded border border-primary/20 hover:bg-primary-light transition">
              ${iconPackage()} ${hasPL ? 'View Packing List' : 'Generate Packing List'}
            </button>
            <button onclick="printDC('${dc.id}')" class="text-xs font-semibold text-gray-600 hover:underline flex items-center gap-1 px-2 py-1 rounded border border-gray-200 hover:bg-gray-50 transition">
              ${iconPrint()} Print
            </button>
          </div>
        `)}
      `;

      openModal(modalContent, { width: 'max-w-4xl' });
    }

    // =============================================================
    // PACKING LIST + TRANSPORT DETAILS FUNCTIONS (Enhancement #6)
    // =============================================================

    function transportDetailsBlockHtml(pl) {
      var hasAny = pl.transporterName || pl.vehicleNumber || pl.ewayBillNumber || pl.driverContact;
      if (!hasAny) return '';
      return `
        <div class="transport-block">
          <div class="meta-label mb-1.5">Transport Details</div>
          <div class="grid grid-cols-2 gap-2 text-xs text-gray-700">
            <div><span class="text-gray-500">Transporter:</span> <span class="font-semibold">${pl.transporterName || '—'}</span></div>
            <div><span class="text-gray-500">Vehicle No.:</span> <span class="font-semibold">${pl.vehicleNumber || '—'}</span></div>
            <div><span class="text-gray-500">E-way Bill No.:</span> <span class="font-semibold">${pl.ewayBillNumber || '—'}</span></div>
            <div><span class="text-gray-500">Driver Contact:</span> <span class="font-semibold">${pl.driverContact || '—'}</span></div>
          </div>
        </div>`;
    }

    function generatePackingList(id) {
      var dc = deliveryChallans.find(function(x) { return x.id === id; });
      if (!dc) return;

      // Open modal to enter packing list + transport details
      var modalContent = `
        ${modalHeader('Generate Packing List', dc.number)}
        <div class="px-5 py-4 modal-scroll">

          <div class="form-subsection-label">Package Details</div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('Package Count *', '<input type="number" class="form-input" id="pl_packages" value="' + (dc.packingList && dc.packingList.packages ? dc.packingList.packages : 1) + '" placeholder="Number of packages">')}
            ${fld('Package Type', '<select class="form-input" id="pl_type"><option ' + (dc.packingList && dc.packingList.packageType === 'Cardboard Box' ? 'selected' : '') + '>Cardboard Box</option><option ' + (dc.packingList && dc.packingList.packageType === 'Wooden Crate' ? 'selected' : '') + '>Wooden Crate</option><option ' + (dc.packingList && dc.packingList.packageType === 'Plastic Container' ? 'selected' : '') + '>Plastic Container</option><option ' + (dc.packingList && dc.packingList.packageType === 'Export Grade Box' ? 'selected' : '') + '>Export Grade Box</option><option ' + (dc.packingList && dc.packingList.packageType === 'Pallet' ? 'selected' : '') + '>Pallet</option><option ' + (dc.packingList && dc.packingList.packageType === 'Other' ? 'selected' : '') + '>Other</option></select>')}
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('Dimensions (LxWxH)', '<input type="text" class="form-input" id="pl_dimensions" value="' + (dc.packingList && dc.packingList.dimensions ? dc.packingList.dimensions : '') + '" placeholder="e.g. 30x20x15 cm">')}
            ${fld('Total Weight', '<input type="text" class="form-input" id="pl_weight" value="' + (dc.packingList && dc.packingList.totalWeight ? dc.packingList.totalWeight : '') + '" placeholder="e.g. 15.5 Kg">')}
          </div>

          <div class="form-subsection-label mt-3">Transport Details</div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('Transporter Name', '<input type="text" class="form-input" id="pl_transporterName" value="' + (dc.packingList && dc.packingList.transporterName ? dc.packingList.transporterName : '') + '" placeholder="e.g. Sharma Road Carriers">')}
            ${fld('Vehicle Number', '<input type="text" class="form-input" id="pl_vehicleNumber" value="' + (dc.packingList && dc.packingList.vehicleNumber ? dc.packingList.vehicleNumber : '') + '" placeholder="e.g. DL-01-AB-1234">')}
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('E-way Bill Number', '<input type="text" class="form-input" id="pl_ewayBillNumber" value="' + (dc.packingList && dc.packingList.ewayBillNumber ? dc.packingList.ewayBillNumber : '') + '" placeholder="e.g. EWB-2401120012345">')}
            ${fld('Driver Contact', '<input type="text" class="form-input" id="pl_driverContact" value="' + (dc.packingList && dc.packingList.driverContact ? dc.packingList.driverContact : '') + '" placeholder="Optional">', 'Optional')}
          </div>

          <div class="mt-3 p-3 bg-gray-50 rounded-lg">
            <p class="text-[10px] text-gray-500">ⓘ Packing List will be linked to this Delivery Challan and will appear in Project Documents (Enhancement #5)</p>
          </div>
        </div>
        ${modalFooter('Generate Packing List', 'onclick="savePackingList(\'' + id + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-lg' });
    }

    function savePackingList(id) {
      var dc = deliveryChallans.find(function(x) { return x.id === id; });
      if (!dc) return;

      var packages = parseInt(document.getElementById('pl_packages').value) || 0;
      var packageType = document.getElementById('pl_type').value || '';
      var dimensions = document.getElementById('pl_dimensions').value || '';
      var totalWeight = document.getElementById('pl_weight').value || '';
      var transporterName = document.getElementById('pl_transporterName').value || '';
      var vehicleNumber = document.getElementById('pl_vehicleNumber').value || '';
      var ewayBillNumber = document.getElementById('pl_ewayBillNumber').value || '';
      var driverContact = document.getElementById('pl_driverContact').value || '';

      if (packages === 0) {
        showToast('Please enter package count', 'error');
        return;
      }

      dc.packingList = {
        packages: packages,
        packageType: packageType,
        dimensions: dimensions,
        totalWeight: totalWeight,
        transporterName: transporterName,
        vehicleNumber: vehicleNumber,
        ewayBillNumber: ewayBillNumber,
        driverContact: driverContact,
        created: true
      };

      closeModal();
      renderDC();
      showToast('Packing List generated successfully for ' + dc.number + '!', 'success');

      // Show packing list view
      setTimeout(function() {
        viewPackingList(id);
      }, 300);
    }

    function viewPackingList(id) {
      var dc = deliveryChallans.find(function(x) { return x.id === id; });
      if (!dc || !dc.packingList || !dc.packingList.created) {
        showToast('Packing List not found for this Delivery Challan', 'error');
        return;
      }

      var pl = dc.packingList;

      var itemsHtml = dc.items.map(function(item) {
        return `
          <tr>
            <td class="px-2 py-1.5 text-xs">${item.name}</td>
            <td class="px-2 py-1.5 text-xs text-center">${item.qty}</td>
            <td class="px-2 py-1.5 text-xs text-center">${item.unit || 'Pcs'}</td>
          </tr>`;
      }).join('');

      var modalContent = `
        ${modalHeader('Packing List — ' + dc.number, 'For Delivery Challan ' + dc.number)}
        <div class="px-5 py-4 modal-scroll">

          <div class="pl-preview">
            <div class="pl-header">
              <div>
                <div class="dc-company-name">${company.name || 'Kunash Media Pvt. Ltd.'}</div>
                <div class="dc-company-details">
                  ${company.address || '401, Creative Hub, BKC, Mumbai - 400051'}<br>
                  GSTIN: ${company.gstin || '27AABCU1234D1ZP'} | Phone: ${company.phone || '+91-9876543210'}
                </div>
              </div>
              <div style="text-align:right;">
                <div class="pl-title">PACKING LIST</div>
              </div>
            </div>

            <div class="dc-meta">
              <div>
                <div class="meta-label">Customer</div>
                <div class="meta-value">${dc.customerName}</div>
                <div class="text-xs text-gray-500">${dc.customerAddress || ''}</div>
              </div>
              <div style="text-align:right;">
                <div><span class="meta-label">DC</span> <span class="meta-value">${dc.number}</span></div>
                <div><span class="meta-label">Date</span> <span class="meta-value">${dc.date}</span></div>
                <div><span class="meta-label">SO Reference</span> <span class="meta-value">${dc.soReference || '—'}</span></div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3 text-sm mb-3">
              <div><span class="text-gray-500">Package Count:</span> <span class="font-semibold">${pl.packages}</span></div>
              <div><span class="text-gray-500">Package Type:</span> <span class="font-semibold">${pl.packageType || '—'}</span></div>
              <div><span class="text-gray-500">Dimensions:</span> <span class="font-semibold">${pl.dimensions || '—'}</span></div>
              <div><span class="text-gray-500">Total Weight:</span> <span class="font-semibold">${pl.totalWeight || '—'}</span></div>
            </div>

            ${transportDetailsBlockHtml(pl)}

            <table class="pl-table" style="margin-top:12px;">
              <thead>
                <tr>
                  <th>Description</th>
                  <th class="text-center">Qty</th>
                  <th class="text-center">Unit</th>
                </tr>
              </thead>
              <tbody>${itemsHtml}</tbody>
            </table>

            <div class="pl-totals">
              <div class="total-row"><span class="label">Total Items</span><span class="value">${dc.items.reduce(function(sum, item) { return sum + item.qty; }, 0)}</span></div>
              <div class="total-row"><span class="label">Total Packages</span><span class="value">${pl.packages}</span></div>
            </div>

            <div class="dc-footer">
              <p>This is a system generated packing list. | ${company.name}</p>
            </div>
          </div>

        </div>
        ${modalFooter('Close', 'onclick="closeModal()"', `
          <div class="flex gap-1.5">
            <button onclick="printPackingList('${dc.id}')" class="text-xs font-semibold text-gray-600 hover:underline flex items-center gap-1 px-2 py-1 rounded border border-gray-200 hover:bg-gray-50 transition">
              ${iconPrint()} Print
            </button>
          </div>
        `)}
      `;

      openModal(modalContent, { width: 'max-w-4xl' });
    }

    // =============================================================
    // PRINT FUNCTIONS
    // =============================================================

    function printDC(id) {
      showToast('Printing Delivery Challan...', 'info');
    }

    function printPackingList(id) {
      showToast('Printing Packing List...', 'info');
    }

    // =============================================================
    // ADD / EDIT DELIVERY CHALLAN
    // =============================================================

    function openAddDC() { openDCModal(null); }

    function editDC(id) {
      var dc = deliveryChallans.find(function(x) { return x.id === id; });
      if (dc) openDCModal(dc);
    }

    function openDCModal(existing) {
      var e = existing || {
        number: 'DC/25-26/' + String(deliveryChallans.length + 1).padStart(3, '0'),
        date: new Date().toISOString().split('T')[0],
        customerId: customers[0].id,
        status: 'draft',
        items: [],
        notes: '',
        shippingAddress: ''
      };
      var isEdit = !!existing;

      // Line items
      var lineItemsHtml = '';
      if (e.items && e.items.length > 0) {
        lineItemsHtml = e.items.map(function(item, idx) {
          return `
            <tr class="border-b border-gray-100 line-item-row">
              <td class="px-2 py-1">
                <select class="form-input text-[10px] item-select" data-idx="${idx}">
                  ${items.map(function(it) { return '<option ' + (it.id === item.itemId ? 'selected' : '') + ' value="' + it.id + '">' + it.name + '</option>'; }).join('')}
                </select>
              </td>
              <td class="px-2 py-1">
                <input type="number" class="form-input text-[10px] item-qty" value="${item.qty}" data-idx="${idx}" placeholder="Qty">
              </td>
              <td class="px-2 py-1">
                <input type="text" class="form-input text-[10px] item-serial" value="${item.serial || ''}" data-idx="${idx}" placeholder="Serial numbers">
              </td>
              <td class="px-2 py-1 text-center">
                <button onclick="removeLineItem(this)" class="text-red-500 hover:text-red-700 transition">${iconX()}</button>
              </td>
            </tr>`;
        }).join('');
      }

      var modalContent = `
        ${modalHeader(isEdit ? 'Edit Delivery Challan' : 'New Delivery Challan', isEdit ? e.number : 'Create a new delivery challan')}

        <div class="px-5 py-4 modal-scroll">

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            ${fld('DC ', '<input type="text" class="form-input" id="f_number" value="' + e.number + '" disabled>')}
            ${fld('Date *', '<input type="date" class="form-input" id="f_date" value="' + e.date + '">')}
            ${fld('Customer *', '<select id="f_customer" class="form-input" onchange="updateAddress()">' + customers.map(function(c) { return '<option ' + (c.id === e.customerId ? 'selected' : '') + ' value="' + c.id + '">' + c.name + '</option>'; }).join('') + '</select>')}
            ${fld('SO Reference', '<select class="form-input" id="f_soReference"><option value="">None</option>' + salesOrders.map(function(so) { return '<option ' + (so.id === e.soReference ? 'selected' : '') + ' value="' + so.number + '">' + so.number + ' - ' + so.customerName + '</option>'; }).join('') + '</select>')}
          </div>

          ${fld('Shipping Address', '<input type="text" class="form-input" id="f_shippingAddress" value="' + (e.shippingAddress || '') + '" placeholder="Shipping address">')}

          <!-- Line Items -->
          <div class="mt-3">
            <div class="flex items-center justify-between mb-1.5">
              <label class="form-label mb-0">Items</label>
              <button onclick="addLineItem()" class="text-[10px] font-semibold text-primary hover:underline flex items-center gap-1">
                ${iconPlus()} Add Item
              </button>
            </div>
            <div class="border border-gray-200 rounded-lg overflow-hidden">
              <table class="w-full text-xs" id="lineItemsTable">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-2 py-1.5 text-left font-semibold text-gray-600">Item</th>
                    <th class="px-2 py-1.5 text-center font-semibold text-gray-600">Qty</th>
                    <th class="px-2 py-1.5 text-left font-semibold text-gray-600">Serial / Batch</th>
                    <th class="px-2 py-1.5 text-center font-semibold text-gray-600" style="width:36px;">Action</th>
                  </tr>
                </thead>
                <tbody id="lineItemsBody">
                  ${lineItemsHtml || '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 mt-3">
            ${fld('Status', '<select class="form-input" id="f_status"><option ' + (e.status === 'draft' ? 'selected' : '') + ' value="draft">Draft</option><option ' + (e.status === 'dispatched' ? 'selected' : '') + ' value="dispatched">Dispatched</option><option ' + (e.status === 'delivered' ? 'selected' : '') + ' value="delivered">Delivered</option></select>')}
          </div>

          ${fld('Notes', '<textarea rows="2" class="form-input" id="f_notes" placeholder="Additional notes">' + (e.notes || '') + '</textarea>')}
        </div>
        ${modalFooter(isEdit ? 'Update Delivery Challan' : 'Save Delivery Challan', 'onclick="saveDC(\'' + (isEdit ? e.id : '') + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-4xl' });
    }

    // =============================================================
    // LINE ITEM FUNCTIONS
    // =============================================================

    function addLineItem() {
      var tbody = document.getElementById('lineItemsBody');
      if (!tbody) return;
      var emptyRow = tbody.querySelector('tr td[colspan]');
      if (emptyRow) tbody.innerHTML = '';

      var idx = tbody.children.length;
      var row = document.createElement('tr');
      row.className = 'border-b border-gray-100 line-item-row';
      row.innerHTML = `
        <td class="px-2 py-1">
          <select class="form-input text-[10px] item-select" data-idx="${idx}">
            ${items.map(function(it) { return '<option value="' + it.id + '">' + it.name + '</option>'; }).join('')}
          </select>
        </td>
        <td class="px-2 py-1">
          <input type="number" class="form-input text-[10px] item-qty" value="1" data-idx="${idx}" placeholder="Qty">
        </td>
        <td class="px-2 py-1">
          <input type="text" class="form-input text-[10px] item-serial" data-idx="${idx}" placeholder="Serial numbers">
        </td>
        <td class="px-2 py-1 text-center">
          <button onclick="removeLineItem(this)" class="text-red-500 hover:text-red-700 transition">${iconX()}</button>
        </td>
      `;
      tbody.appendChild(row);
    }

    function removeLineItem(btn) {
      var row = btn.closest('tr');
      if (row) row.remove();
      var tbody = document.getElementById('lineItemsBody');
      if (tbody && tbody.children.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products.</td></tr>';
      }
    }

    function updateAddress() {
      var customerId = document.getElementById('f_customer').value;
      var customer = customers.find(function(c) { return c.id === customerId; });
      if (customer && customer.address) {
        document.getElementById('f_shippingAddress').value = customer.address;
      }
    }

    // =============================================================
    // SAVE / DELETE DELIVERY CHALLAN
    // =============================================================

    function saveDC(existingId) {
      var number = document.getElementById('f_number').value;
      var date = document.getElementById('f_date').value;
      var customerId = document.getElementById('f_customer').value;
      var shippingAddress = document.getElementById('f_shippingAddress').value || '';
      var soReference = document.getElementById('f_soReference').value || '';
      var status = document.getElementById('f_status').value;
      var notes = document.getElementById('f_notes').value || '';

      if (!date || !customerId) {
        showToast('Please fill all required fields (Date, Customer)', 'error');
        return;
      }

      var itemsData = [];
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      rows.forEach(function(row) {
        var itemId = row.querySelector('.item-select').value;
        var qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        var serial = row.querySelector('.item-serial').value || '';
        if (qty > 0) {
          var item = items.find(function(it) { return it.id === itemId; });
          itemsData.push({
            itemId: itemId,
            name: item ? item.name : '',
            qty: qty,
            unit: item ? item.unit : 'Pcs',
            serial: serial
          });
        }
      });

      if (itemsData.length === 0) {
        showToast('Please add at least one item to the delivery challan', 'error');
        return;
      }

      var customer = customers.find(function(c) { return c.id === customerId; });
      var customerName = customer ? customer.name : '';

      if (existingId) {
        var dc = deliveryChallans.find(function(x) { return x.id === existingId; });
        if (dc) {
          dc.number = number;
          dc.date = date;
          dc.customerId = customerId;
          dc.customerName = customerName;
          dc.customerAddress = customer ? customer.address : '';
          dc.shippingAddress = shippingAddress || (customer ? customer.address : '');
          dc.soReference = soReference;
          dc.status = status;
          dc.items = itemsData;
          dc.notes = notes;
          showToast('Delivery Challan updated successfully', 'success');
        }
      } else {
        var newDC = {
          id: 'DC-' + String(nextDCNo++).padStart(3, '0'),
          number: number || 'DC/25-26/' + String(deliveryChallans.length + 1).padStart(3, '0'),
          date: date,
          customerId: customerId,
          customerName: customerName,
          customerAddress: customer ? customer.address : '',
          shippingAddress: shippingAddress || (customer ? customer.address : ''),
          soReference: soReference,
          status: status,
          items: itemsData,
          packingList: { packages: 0, packageType: '', dimensions: '', totalWeight: '', transporterName: '', vehicleNumber: '', ewayBillNumber: '', driverContact: '', created: false },
          notes: notes,
          createdAt: date
        };
        deliveryChallans.unshift(newDC);
        showToast('Delivery Challan created successfully', 'success');
      }

      closeModal();
      renderDC();
    }

    function delDC(id) {
      var dc = deliveryChallans.find(function(x) { return x.id === id; });
      if (!dc) return;

      var modalContent = `
        ${modalHeader('Delete Delivery Challan', dc.number)}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${dc.number}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone. All associated data will be removed.</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteDC(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteDC(id) {
      deliveryChallans = deliveryChallans.filter(function(x) { return x.id !== id; });
      closeModal();
      renderDC();
      showToast('Delivery Challan deleted successfully', 'warning');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search delivery challans by number, customer…"
              onkeyup="filterDC()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    // Company details
    var company = {
      name: 'Kunash Media Pvt. Ltd.',
      address: '401, Creative Hub, BKC, Bandra East, Mumbai - 400051',
      gstin: '27AABCU1234D1ZP',
      phone: '+91-9876543210'
    };

    renderDC();

    console.log('📦 Delivery Challan Module Loaded Successfully');
    console.log('📊 Total DC:', deliveryChallans.length);
    console.log('📦 Packing List (Enhancement #6) enabled');
    console.log('📌 Status: Draft(' + deliveryChallans.filter(function(dc) { return dc.status === 'draft'; }).length +
      '), Dispatched(' + deliveryChallans.filter(function(dc) { return dc.status === 'dispatched'; }).length +
      '), Delivered(' + deliveryChallans.filter(function(dc) { return dc.status === 'delivered'; }).length + ')');

  </script>

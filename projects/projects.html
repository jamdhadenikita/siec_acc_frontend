<style>
  body {

    background: #f3f4f6;

  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;

    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.12);
    background: #ffffff;
  }
  .form-input:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
  }

  .form-label {
    font-size: 10px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 9.5px; color: #9ca3af; margin-top: 2px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }
  .badge-dot-purple { background: #8b5cf6; }

  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    padding: 10px 14px !important;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-card .stat-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
  }
  .stat-card .stat-value {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
    margin-top: 2px;
  }

  .table-row-hover:hover {
    background: #f8fafc;
  }

  .btn-icon-action {
    transition: all 0.15s ease;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }
  .btn-icon-action.primary:hover {
    background: #eef5e8;
    color: #6da84c;
  }

  .toast {
    animation: fadeIn 0.2s ease;
    font-size: 12px;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  .modal-scroll {
    max-height: 55vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .modal-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }

  .empty-icon-svg {
    opacity: 0.2;
    width: 40px;
    height: 40px;
    color: #94a3b8;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .page-subtitle {
    font-size: 12px;
    color: #6b7280;
  }
  .page-breadcrumb {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6da84c;
  }

  table th {
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
    padding: 8px 12px;
  }
  table td {
    font-size: 12px;
    padding: 8px 12px;
  }
  table td .font-mono {
    font-size: 11px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
  }
  .modal-subtitle {
    font-size: 11px;
    color: #6b7280;
  }

  .filter-btn {
    font-size: 11px;
    padding: 5px 12px;
  }
  .filter-btn svg {
    width: 14px;
    height: 14px;
  }

  /* Page tabs */
  .page-tab-btn {
    transition: all 0.2s ease;
    padding: 8px 14px;
    font-size: 11px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    color: #6b7280;
    cursor: pointer;
    background: transparent;
    white-space: nowrap;
  }
  .page-tab-btn.active {
    color: #6da84c;
    border-bottom-color: #6da84c;
    font-weight: 600;
  }
  .page-tab-btn:hover:not(.active) {
    color: #1f2937;
    border-bottom-color: #d1d5db;
  }
  .page-tab-panel { display: none; }
  .page-tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

  /* Project card */
  .project-card {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px 16px;
    background: #ffffff;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    cursor: pointer;
  }
  .project-card:hover {
    border-color: #6da84c;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    transform: translateY(-1px);
  }
  .project-card .proj-name {
    font-size: 13px;
    font-weight: 700;
    color: #1a1a2e;
  }
  .project-card .proj-customer {
    font-size: 11px;
    color: #6b7280;
  }
  .project-card .proj-budget {
    font-size: 12px;
    font-weight: 600;
    color: #6da84c;
  }

  /* Project progress bar */
  .progress-bar {
    height: 6px;
    border-radius: 3px;
    background: #e5e7eb;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-bar .fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }
  .progress-bar .fill-green { background: #22c55e; }
  .progress-bar .fill-amber { background: #f59e0b; }
  .progress-bar .fill-blue { background: #3b82f6; }

  /* Document file item */
  .doc-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #ffffff;
    transition: border-color 0.2s, background 0.15s;
  }
  .doc-item:hover {
    border-color: #6da84c;
    background: #f8fafc;
  }
  .doc-item .doc-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef5e8;
    color: #6da84c;
    flex-shrink: 0;
  }
  .doc-item .doc-name {
    font-size: 12px;
    font-weight: 600;
    color: #1a1a2e;
  }
  .doc-item .doc-meta {
    font-size: 10px;
    color: #6b7280;
  }

  /* Report table */
  .report-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .report-table th {
    background: #f8fafc;
    text-align: left;
    padding: 8px 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b7280;
    border-bottom: 2px solid #e5e7eb;
  }
  .report-table td {
    padding: 6px 10px;
    border-bottom: 1px solid #f1f5f9;
  }
  .report-table .text-right { text-align: right; }
  .report-table .text-center { text-align: center; }
  .report-table .total-row {
    border-top: 2px solid #e5e7eb;
    border-bottom: 2px solid #e5e7eb;
    font-weight: 700;
    background: #f8fafc;
  }
  .report-table .grand-total {
    font-weight: 700;
    color: #6da84c;
    background: #eef5e8;
  }
</style>
</head>

    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function statusBadge(status) {
      var map = {
        active: 'badge-blue',
        completed: 'badge-green',
        onhold: 'badge-amber',
        cancelled: 'badge-red',
        pending: 'badge-gray'
      };
      var dot = {
        active: 'badge-dot-blue',
        completed: 'badge-dot-green',
        onhold: 'badge-dot-amber',
        cancelled: 'badge-dot-red',
        pending: 'badge-dot-gray'
      };
      var label = status.charAt(0).toUpperCase() + status.slice(1);
      if (status === 'onhold') label = 'On Hold';
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';
    }

      return `

            ${extraHead || ''}

    }

    function tableHtml(cols, rowsHtml) {
      var colHeaders = cols.map(function(c) {
        return '<th class="text-left font-semibold whitespace-nowrap">' + c + '</th>';

      return `
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-200">${colHeaders}</tr>
            </thead>
            <tbody id="tbody-anchor">${rowsHtml}</tbody>

    }

      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';

        'Project Overview',
        html,
        '<div class="text-[10px] text-gray-400">Project ID: ' + p.id + '</div>'
      );
    }

    // =============================================================
    // RENDER SALES
    // =============================================================

    function renderSales() {
      var rowsHtml = projectSales.filter(function(s) { return s.projectId === selectedProjectId; }).map(function(s) {
        return `
          <tr class="border-b border-gray-100 table-row-hover">
            <td class="px-3 py-2.5 text-sm">${s.number}</td>
            <td class="px-3 py-2.5 text-xs text-gray-500">${s.date}</td>
            <td class="px-3 py-2.5 text-sm text-gray-700">${s.customer}</td>
            <td class="px-3 py-2.5 font-mono font-semibold text-right text-primary">${money(s.amount)}</td>
            <td class="px-3 py-2.5">${statusBadge(s.status)}</td>
          </tr>`;
      }).join('');

      if (!rowsHtml) rowsHtml = '<tr><td colspan="5" class="text-center py-6 text-gray-400 text-sm">No sales linked to this project</td></tr>';

      document.getElementById('salesPanel').innerHTML = panelWrap(
        'Project Sales',
        tableHtml(['Invoice #', 'Date', 'Customer', 'Amount', 'Status'], rowsHtml)
      );
    }

    // =============================================================
    // RENDER PURCHASES
    // =============================================================

    function renderPurchases() {
      var rowsHtml = projectPurchases.filter(function(p) { return p.projectId === selectedProjectId; }).map(function(p) {
        return `
          <tr class="border-b border-gray-100 table-row-hover">
            <td class="px-3 py-2.5 text-sm">${p.number}</td>
            <td class="px-3 py-2.5 text-xs text-gray-500">${p.date}</td>
            <td class="px-3 py-2.5 text-sm text-gray-700">${p.vendor}</td>
            <td class="px-3 py-2.5 font-mono font-semibold text-right text-red-600">${money(p.amount)}</td>
            <td class="px-3 py-2.5">${statusBadge(p.status)}</td>
          </tr>`;
      }).join('');

      if (!rowsHtml) rowsHtml = '<tr><td colspan="5" class="text-center py-6 text-gray-400 text-sm">No purchases linked to this project</td></tr>';

      document.getElementById('purchasesPanel').innerHTML = panelWrap(
        'Project Purchases',
        tableHtml(['Bill #', 'Date', 'Vendor', 'Amount', 'Status'], rowsHtml)
      );
    }

    // =============================================================
    // RENDER EXPENSES
    // =============================================================

    function renderExpenses() {
      var rowsHtml = projectExpenses.filter(function(e) { return e.projectId === selectedProjectId; }).map(function(e) {
        return `
          <tr class="border-b border-gray-100 table-row-hover">
            <td class="px-3 py-2.5 text-xs text-gray-500">${e.date}</td>
            <td class="px-3 py-2.5 text-sm text-gray-700">${e.category}</td>
            <td class="px-3 py-2.5 text-sm text-gray-500">${e.vendor || '—'}</td>
            <td class="px-3 py-2.5 font-mono font-semibold text-right text-amber-600">${money(e.amount)}</td>
            <td class="px-3 py-2.5">${statusBadge(e.status)}</td>
          </tr>`;
      }).join('');

      if (!rowsHtml) rowsHtml = '<tr><td colspan="5" class="text-center py-6 text-gray-400 text-sm">No expenses linked to this project</td></tr>';

      document.getElementById('expensesPanel').innerHTML = panelWrap(
        'Project Expenses',
        tableHtml(['Date', 'Category', 'Vendor', 'Amount', 'Status'], rowsHtml)
      );
    }

    // =============================================================
    // RENDER TIMESHEET
    // =============================================================

    function renderTimesheet() {
      var rowsHtml = timesheets.filter(function(t) { return t.projectId === selectedProjectId; }).map(function(t) {
        return `
          <tr class="border-b border-gray-100 table-row-hover">
            <td class="px-3 py-2.5 text-xs text-gray-500">${t.date}</td>
            <td class="px-3 py-2.5 text-sm font-semibold">${t.employee}</td>
            <td class="px-3 py-2.5 text-sm text-gray-700">${t.task}</td>
            <td class="px-3 py-2.5 text-center font-mono text-sm">${t.hours}h</td>
            <td class="px-3 py-2.5 text-center">${t.billable ? '<span class="badge badge-green">Billable</span>' : '<span class="badge badge-gray">Non-Billable</span>'}</td>
            <td class="px-3 py-2.5 font-mono text-sm text-right">${t.billable ? money(t.rate) : '—'}</td>
            <td class="px-3 py-2.5 text-sm text-gray-500">${t.description}</td>
          </tr>`;
      }).join('');

      if (!rowsHtml) rowsHtml = '<tr><td colspan="7" class="text-center py-6 text-gray-400 text-sm">No timesheets for this project</td></tr>';

      document.getElementById('timesheetPanel').innerHTML = panelWrap(
        'Project Timesheets',
        tableHtml(['Date', 'Employee', 'Task', 'Hours', 'Type', 'Rate', 'Description'], rowsHtml)
      );
    }

    // =============================================================
    // RENDER BUDGET
    // =============================================================

    function renderBudget() {
      var b = projectBudgets.find(function(x) { return x.projectId === selectedProjectId; });
      if (!b) {
        document.getElementById('budgetPanel').innerHTML = panelWrap('Project Budget', '<div class="text-center py-6 text-gray-400 text-sm">No budget configured</div>');
        return;
      }

      var usagePct = b.totalBudget > 0 ? ((b.actualCost / b.totalBudget) * 100).toFixed(1) : 0;

      var html = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <table class="report-table">
              <tbody>
                <tr><td class="text-gray-500">Total Budget</td><td class="text-right font-mono font-semibold">${money(b.totalBudget)}</td></tr>
                <tr><td class="text-gray-500">Purchase Budget</td><td class="text-right font-mono">${money(b.purchaseBudget)}</td></tr>
                <tr><td class="text-gray-500">Expense Budget</td><td class="text-right font-mono">${money(b.expenseBudget)}</td></tr>
                <tr><td class="text-gray-500">Hours Budget</td><td class="text-right font-mono">${money(b.hoursBudget)}</td></tr>
                <tr class="total-row"><td class="text-right font-bold">Actual Cost</td><td class="text-right font-mono font-bold text-red-600">${money(b.actualCost)}</td></tr>
                <tr class="grand-total"><td class="text-right font-bold">Budget Variance</td><td class="text-right font-mono font-bold text-primary">${money(b.variance)}</td></tr>
              </tbody>
            </table>
          </div>
          <div>
            <h4 class="text-sm font-bold text-gray-800 mb-2">Budget Utilization</h4>
            <div class="progress-bar" style="height:12px;">
              <div class="fill ${usagePct > 90 ? 'fill-amber' : 'fill-blue'}" style="width:${Math.min(usagePct, 100)}%;height:100%;"></div>
            </div>
            <div class="flex justify-between text-xs mt-1">
              <span class="text-gray-500">${usagePct}% used</span>
              <span class="text-gray-500">${money(b.actualCost)} / ${money(b.totalBudget)}</span>
            </div>

            <div class="mt-4 p-3 bg-gray-50 rounded-lg text-xs text-gray-600">
              <div class="flex items-start gap-2">
                ${iconInfo()}
                <span>Budget alerts trigger automatically when usage exceeds thresholds.</span>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('budgetPanel').innerHTML = panelWrap('Budget Configuration & Variance', html);
    }

    // =============================================================
    // RENDER JOURNALS
    // =============================================================

    function renderJournals() {
      var rowsHtml = projectJournals.filter(function(j) { return j.projectId === selectedProjectId; }).map(function(j) {
        return `
          <tr class="border-b border-gray-100 table-row-hover">
            <td class="px-3 py-2.5 text-sm">${j.id}</td>
            <td class="px-3 py-2.5 text-xs text-gray-500">${j.date}</td>
            <td class="px-3 py-2.5 text-sm text-gray-700">${j.narration}</td>
            <td class="px-3 py-2.5 text-xs text-gray-500">${j.reference}</td>
            <td class="px-3 py-2.5 font-mono font-semibold text-right text-primary">${money(j.amount)}</td>
          </tr>`;
      }).join('');

      if (!rowsHtml) rowsHtml = '<tr><td colspan="5" class="text-center py-6 text-gray-400 text-sm">No journals linked to this project</td></tr>';

      document.getElementById('journalsPanel').innerHTML = panelWrap(
        'Project Journal Entries',
        tableHtml(['Journal #', 'Date', 'Narration', 'Reference', 'Amount'], rowsHtml)
      );
    }

    // =============================================================
    // RENDER DOCUMENTS (Enhancement #5)
    // =============================================================

    function renderDocuments() {
      var docs = projectDocuments.filter(function(d) { return d.projectId === selectedProjectId; });

      // Filter by type
      var typeFilter = document.getElementById('docTypeFilter') ? document.getElementById('docTypeFilter').value : 'all';
      if (typeFilter !== 'all') {
        docs = docs.filter(function(d) { return d.type === typeFilter; });
      }

      var docsHtml = docs.map(function(d) {
        var iconHtml = d.type === 'Invoice' || d.type === 'Purchase Bill' || d.type === 'Purchase Order' ? iconDocument() :
                       d.type === 'Contract' || d.type === 'Packing List' || d.type === 'Delivery Challan' ? iconPdf() :
                       d.type === 'Site Photo' ? iconImage() : iconDocument();
        return `
          <div class="doc-item">
            <div class="doc-icon">${iconHtml}</div>
            <div class="flex-1 min-w-0">
              <div class="doc-name truncate">${d.name}</div>
              <div class="doc-meta">${d.type} · ${d.date} · ${d.size} · ${d.uploadedBy}</div>
            </div>
            <div class="flex gap-1">
              <button onclick="downloadDocument('${d.id}')" class="btn-icon-action" title="Download">${iconDownload()}</button>
              <button onclick="deleteDocument('${d.id}')" class="btn-icon-action danger" title="Delete">${iconTrash()}</button>
            </div>
          </div>`;
      }).join('');

      if (!docsHtml) docsHtml = '<div class="text-center py-6 text-gray-400 text-sm">No documents uploaded for this project</div>';

      // Get unique document types
      var types = ['all'];
      projectDocuments.filter(function(d) { return d.projectId === selectedProjectId; }).forEach(function(d) {
        if (types.indexOf(d.type) === -1) types.push(d.type);
      });

      var filterOptions = types.map(function(t) {
        return '<option value="' + t + '">' + (t === 'all' ? 'All Types' : t) + '</option>';
      }).join('');

      var html = `
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <div class="flex items-center gap-2">
            <label class="form-label mb-0">Filter by Type</label>
            <select id="docTypeFilter" class="form-input text-[11px] max-w-xs" onchange="renderDocuments()">
              ${filterOptions}
            </select>
          </div>
          <button onclick="uploadDocument()" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[11px] font-semibold px-3 py-2 rounded-lg transition shadow-sm">
            ${iconPlus()} Upload Document
          </button>
        </div>

        <div class="space-y-2" id="docsList">
          ${docsHtml}
        </div>

        <div class="mt-3 p-3 bg-primary-soft rounded-lg text-xs text-gray-600 border border-primary/20">
          <div class="flex items-start gap-2">
            ${iconInfo()}
            <div>
              <b>Enhancement #5 — Project-Wise Document Management</b><br>
              All Purchase Orders, Purchase Bills, Sales Invoices, Delivery Challans and Packing Lists auto-appear here. Manually uploaded documents (contracts, site photos) also stay linked.
            </div>
          </div>
        </div>
      `;

      document.getElementById('documentsPanel').innerHTML = panelWrap(
        'Project Documents <span class="text-[10px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full ml-1">' + docs.length + '</span>',
        html,
        '<div class="text-[10px] text-gray-400">' + docs.length + ' documents</div>'
      );
    }

    // =============================================================
    // RENDER ACTIVITY
    // =============================================================

    function renderActivity() {
      var rowsHtml = activityLogs.filter(function(a) { return a.projectId === selectedProjectId; }).map(function(a) {
        return `
          <tr class="border-b border-gray-100 table-row-hover">
            <td class="px-3 py-2.5 text-xs text-gray-500">${a.date}</td>
            <td class="px-3 py-2.5 text-sm font-semibold">${a.user}</td>
            <td class="px-3 py-2.5 text-sm text-gray-700">${a.action}</td>
            <td class="px-3 py-2.5 text-xs text-gray-500">${a.detail}</td>
          </tr>`;
      }).join('');

      if (!rowsHtml) rowsHtml = '<tr><td colspan="4" class="text-center py-6 text-gray-400 text-sm">No activity logged</td></tr>';

      document.getElementById('activityPanel').innerHTML = panelWrap(
        'Activity Log',
        tableHtml(['Date', 'User', 'Action', 'Details'], rowsHtml)
      );
    }

    // =============================================================
    // DOCUMENT ACTIONS
    // =============================================================

    function uploadDocument() {
      showToast('Document upload — coming soon!', 'info');
    }

    function downloadDocument(id) {
      var d = projectDocuments.find(function(x) { return x.id === id; });
      if (d) showToast('Downloading ' + d.name + '...', 'info');
    }

    function deleteDocument(id) {
      if (confirm('Delete this document?')) {
        projectDocuments = projectDocuments.filter(function(x) { return x.id !== id; });
        renderDocuments();
        showToast('Document deleted', 'warning');
      }
    }

    // =============================================================
    // PROJECT ACTIONS
    // =============================================================

    function openAddProject() {
      var modalContent = `
        ${modalHeader('New Project', 'Create a new project')}
        <div class="px-5 py-4">
          <div class="grid grid-cols-2 gap-3">
            ${fld('Project Name *', '<input type="text" class="form-input" id="p_name" placeholder="Project name">')}
            ${fld('Project Code *', '<input type="text" class="form-input" id="p_code" placeholder="e.g. 26LW073">')}
            ${fld('Customer *', '<input type="text" class="form-input" id="p_customer" placeholder="Customer name">')}
            ${fld('Project Manager', '<input type="text" class="form-input" id="p_pm" placeholder="PM name">')}
            ${fld('Start Date', '<input type="date" class="form-input" id="p_start" value="' + new Date().toISOString().split('T')[0] + '">')}
            ${fld('End Date', '<input type="date" class="form-input" id="p_end">')}
            ${fld('Total Budget (₹)', '<input type="number" class="form-input" id="p_budget" placeholder="0.00">')}
            ${fld('Status', '<select class="form-input" id="p_status"><option value="active">Active</option><option value="pending">Pending</option><option value="onhold">On Hold</option><option value="completed">Completed</option></select>')}
          </div>
          ${fld('Description', '<textarea rows="2" class="form-input" id="p_desc" placeholder="Project description"></textarea>')}
        </div>
        ${modalFooter('Create Project', 'onclick="saveProject()"')}
      `;
      openModal(modalContent, { width: 'max-w-lg' });
    }

    function saveProject() {
      var name = document.getElementById('p_name').value.trim();
      var code = document.getElementById('p_code').value.trim();
      var customer = document.getElementById('p_customer').value.trim();
      if (!name || !code || !customer) {
        showToast('Please fill required fields (Name, Code, Customer)', 'error');
        return;
      }
      var newProject = {
        id: 'PRJ-' + String(projects.length + 1).padStart(3, '0'),
        name: name,
        code: code,
        customer: customer,
        status: document.getElementById('p_status').value,
        startDate: document.getElementById('p_start').value,
        endDate: document.getElementById('p_end').value,
        progress: 0,
        budget: parseFloat(document.getElementById('p_budget').value) || 0,
        actualCost: 0,
        revenue: 0,
        profit: 0,
        pm: document.getElementById('p_pm').value || '—',
        description: document.getElementById('p_desc').value || ''
      };
      projects.unshift(newProject);
      closeModal();
      renderProjects();
      renderStats();
      showToast('Project created successfully', 'success');
    }

    function exportProjectReport() {
      showToast('Exporting project report...', 'info');
      setTimeout(function() {
        showToast('Report exported successfully!', 'success');
      }, 1200);
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search projects by name, customer, code…"
              onkeyup="filterProjects()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    function filterProjects() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var cards = document.querySelectorAll('.project-card');
      cards.forEach(function(c) {
        var text = c.textContent.toLowerCase();
        c.style.display = text.indexOf(q) !== -1 ? '' : 'none';
      });
    }

    // =============================================================
    // INIT
    // =============================================================

    renderProjects();
    renderStats();
    renderOverview();
    renderSales();
    renderPurchases();
    renderExpenses();
    renderTimesheet();
    renderBudget();
    renderJournals();
    renderDocuments();
    renderActivity();

    console.log('📁 Projects Module Loaded Successfully');
    console.log('📊 Total Projects:', projects.length);
    console.log('📌 Active:', projects.filter(function(p) { return p.status === 'active'; }).length);
    console.log('📄 Documents:', projectDocuments.length);
    console.log('🎯 Enhancement #5 — Project-Wise Document Management enabled');

  </script>

</body>
</html>

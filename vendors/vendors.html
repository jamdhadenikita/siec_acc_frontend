<style>
  /* Form styles */
  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
    background: #ffffff;
  }
  .form-input:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
  }
  .form-label {
    font-size: 11.5px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 4px;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 10.5px; color: #9ca3af; margin-top: 3px; }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }

  /* Stats card */
  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }

  /* Table row hover */
  .table-row-hover:hover {
    background: #f8fafc;
  }

  /* Modal tabs */
  .modal-tab-btn {
    transition: all 0.2s ease;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    color: #6b7280;
    cursor: pointer;
    background: transparent;
  }
  .modal-tab-btn.active {
    color: #6da84c;
    border-bottom-color: #6da84c;
  }
  .modal-tab-btn:hover:not(.active) {
    color: #1f2937;
    border-bottom-color: #d1d5db;
  }
  .modal-tab-panel { display: none; }
  .modal-tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  /* Action buttons */
  .btn-icon-action {
    transition: all 0.15s ease;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }

  /* Toast */
  .toast {
    animation: fadeIn 0.2s ease;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  /* Scrollbar for modal */
  .modal-scroll {
    max-height: 60vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .modal-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }

  /* Empty state */
  .empty-icon-svg {
    opacity: 0.2;
    width: 48px;
    height: 48px;
    color: #94a3b8;
  }

  /* Vendor logo placeholder */
  .vendor-avatar {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
  }
</style>

    // ---------- Toast System ----------
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // ---------- Modal System ----------
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full ${opts.width || 'max-w-3xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

      return `

            ${subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + subtitle + '</p>' : ''}

          <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

          </div>

      }
    });

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

      return '<span class="badge ' + map[color] + '"><span class="badge-dot ' + dot[color] + '"></span>' + text + '</span>';

    function getInitials(name) {
      if (!name) return 'V';
      var parts = name.split(' ');
      if (parts.length === 1) return name.substring(0, 2).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function renderStats() {
      document.getElementById('totalVendors').textContent = vendors.length;
      var active = vendors.filter(function(v) { return v.status === 'active'; });
      document.getElementById('activeVendors').textContent = active.length;
      var gst = vendors.filter(function(v) { return v.gstRegistered; });
      document.getElementById('gstVendors').textContent = gst.length;
      var total = vendors.reduce(function(sum, v) { return sum + v.outstanding; }, 0);
      document.getElementById('totalPayable').textContent = money(total);
    }

    function getFilteredVendors() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.toLowerCase() : '';
      var status = document.getElementById('filterStatus').value || 'all';
      var gst = document.getElementById('filterGST').value || 'all';

      return vendors.filter(function(v) {
        var matchSearch = v.name.toLowerCase().indexOf(q) !== -1 ||
          v.companyName.toLowerCase().indexOf(q) !== -1 ||
          v.id.toLowerCase().indexOf(q) !== -1 ||
          v.phone.indexOf(q) !== -1 ||
          v.email.toLowerCase().indexOf(q) !== -1;
        var matchStatus = status === 'all' || v.status === status;
        var matchGST = gst === 'all' || (gst === 'yes' ? v.gstRegistered : !v.gstRegistered);
        return matchSearch && matchStatus && matchGST;
      });
    }

    function saveVendor(existingId) {
      var name = document.getElementById('f_name') ? document.getElementById('f_name').value.trim() : '';
      var companyName = document.getElementById('f_company') ? document.getElementById('f_company').value.trim() : '';
      var email = document.getElementById('f_email') ? document.getElementById('f_email').value.trim() : '';
      var phone = document.getElementById('f_phone') ? document.getElementById('f_phone').value.trim() : '';
      var address = document.getElementById('f_address') ? document.getElementById('f_address').value.trim() : '';
      var city = document.getElementById('f_city') ? document.getElementById('f_city').value.trim() : '';
      var state = document.getElementById('f_state') ? document.getElementById('f_state').value : 'Maharashtra';
      var stateCode = document.getElementById('f_stateCode') ? document.getElementById('f_stateCode').value : '27';
      var pincode = document.getElementById('f_pincode') ? document.getElementById('f_pincode').value.trim() : '';
      var gstin = document.getElementById('f_gstin') ? document.getElementById('f_gstin').value.trim().toUpperCase() : '';
      var pan = document.getElementById('f_pan') ? document.getElementById('f_pan').value.trim().toUpperCase() : '';
      var bankName = document.getElementById('f_bankName') ? document.getElementById('f_bankName').value.trim() : '';
      var bankAccount = document.getElementById('f_bankAccount') ? document.getElementById('f_bankAccount').value.trim() : '';
      var bankIfsc = document.getElementById('f_bankIfsc') ? document.getElementById('f_bankIfsc').value.trim().toUpperCase() : '';
      var paymentTerms = document.getElementById('f_paymentTerms') ? document.getElementById('f_paymentTerms').value : 'Net 15 days';
      var gstRegRadio = document.querySelector('input[name="gstReg"]:checked');
      var gstRegistered = gstRegRadio ? gstRegRadio.value === 'true' : false;
      var statusRadio = document.querySelector('input[name="vendorStatus"]:checked');
      var status = statusRadio ? statusRadio.value : 'active';

      if (!name || !email || !phone) {
        showToast('Please fill all required fields (Name, Email, Phone)', 'error');
        return;
      }

      var color = vendorColors[Math.floor(Math.random() * vendorColors.length)];

      if (existingId) {
        var v = vendors.find(function(x) { return x.id === existingId; });
        if (v) {
          v.name = name;
          v.companyName = companyName;
          v.email = email;
          v.phone = phone;
          v.address = address;
          v.city = city;
          v.state = state;
          v.stateCode = stateCode;
          v.pincode = pincode;
          v.gstin = gstin;
          v.pan = pan;
          v.bankName = bankName;
          v.bankAccount = bankAccount;
          v.bankIfsc = bankIfsc;
          v.paymentTerms = paymentTerms;
          v.gstRegistered = gstRegistered;
          v.status = status;
          showToast('Vendor updated successfully', 'success');
        }
      } else {
        var newVendor = {
          id: 'VEN-' + String(nextVendorNo++).padStart(3, '0'),
          name: name,
          companyName: companyName,
          email: email,
          phone: phone,
          address: address,
          city: city,
          state: state,
          stateCode: stateCode,
          pincode: pincode,
          gstin: gstin,
          pan: pan,
          bankName: bankName,
          bankAccount: bankAccount,
          bankIfsc: bankIfsc,
          paymentTerms: paymentTerms,
          gstRegistered: gstRegistered,
          status: status,
          outstanding: 0,
          createdAt: new Date().toISOString().split('T')[0],
          color: color
        };
        vendors.unshift(newVendor);
        showToast('Vendor added successfully', 'success');
      }

      closeModal();
      renderVendors();
    }

      var modalContent = `

        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteVendor(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteVendor(id) {
      vendors = vendors.filter(function(x) { return x.id !== id; });
      closeModal();
      renderVendors();
      showToast('Vendor deleted successfully', 'warning');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search vendors by name, company, phone…"
              onkeyup="filterVendors()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    renderVendors();

    console.log('🏢 Vendors Module Loaded Successfully');
    console.log('📊 Total Vendors:', vendors.length);
    console.log('✅ Active Vendors:', vendors.filter(function(v) { return v.status === 'active'; }).length);
    console.log('💰 Total Payable:', vendors.reduce(function(sum, v) { return sum + v.outstanding; }, 0));

  </script>

</body>
</html>
